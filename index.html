<title>IPO Emprèn</title>
<script>
// Aparença: 'auto' (segons el sistema), 'light' o 'dark'. Es desa en aquest navegador i s'aplica abans de pintar.
const THEME_MQ = matchMedia('(prefers-color-scheme: dark)');
function themePref() { try { return localStorage.getItem('ipoTema') || 'auto'; } catch (e) { return 'auto'; } }
function applyTheme() { const p = themePref(); document.documentElement.classList.toggle('dark', p === 'dark' || (p === 'auto' && THEME_MQ.matches));
  document.querySelectorAll('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeSet === p))); }
function setTheme(p) { try { localStorage.setItem('ipoTema', p); } catch (e) {} applyTheme(); }
THEME_MQ.addEventListener('change', applyTheme); applyTheme();
document.addEventListener('click', e => { const b = e.target.closest('[data-theme-set]'); if (b) setTheme(b.dataset.themeSet); });
</script>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
/* Disseny: menú lateral fosc + gran plafó blanc arrodonit; xifres grans, botons negres, llistes amb fileres i fletxes.
   El tema fosc és al final de tot («TEMA FOSC»). */
:root{
  --side:#1c1c1e; --side-2:#2a2a2d; --side-fg:#f4f4f5; --side-muted:#8d8d93;
  --bg:#ffffff; --soft:#f7f7f8; --ink:#111113; --muted:#76767d; --line:#ebebee;
  --accent:#f7a21b; --accent-ink:#b45309; --accent-soft:#fff4e0;
  --blue:#2d5bea; --blue-soft:#ebf0ff;
  --warn:#a85f00; --warn-soft:#fff3df; --bad:#d23a30; --bad-soft:#fdecea;
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --c1:#22b06b; --c2:#2d5bea; --c3:#f08c1a; --c4:#e0457b; --c5:#8455e8; --c6:#1aa3b8;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--side);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side)}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
/* Menú lateral */
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;display:flex;flex-direction:column;gap:8px;color:var(--side-fg);padding-block:22px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:22px;letter-spacing:-.02em;padding:0 10px 18px;border-bottom:1px solid var(--side-2)}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px}
.side-label{font-size:13px;color:var(--side-muted);padding:16px 12px 4px}
.role select{width:100%;background:var(--side-2);color:var(--side-fg);border:0;border-radius:10px;padding:10px 12px;font:500 14px var(--font)}
.role select option{background:#ffffff;color:#111113}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-radius:12px;padding:12px;color:var(--side-fg);font:500 16px var(--font);text-align:left;cursor:pointer;opacity:.85}
.nav button:hover{background:var(--side-2);opacity:1}
.nav button[aria-selected="true"]{background:var(--side-2);opacity:1;font-weight:600}
.nav svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;padding:14px 12px 0;border-top:1px solid var(--side-2);display:grid;gap:8px;font-size:13px;color:var(--side-muted)}
.side-foot b{color:var(--side-fg);font-weight:500;font-size:14px}
.quarter{display:flex;gap:4px}
.quarter .q{flex:1;height:6px;border-radius:3px;background:var(--side-2)}
.quarter .q.done{background:var(--accent)}
.quarter .q.now{background:var(--side-fg)}
/* Plafó blanc */
.panel{background:var(--bg);margin:12px 12px 12px 0;border-radius:22px;min-width:0}
.content{max-width:1120px;margin:0 auto;padding-block:48px 72px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:28px}
@media (min-width:1100px){.content{padding-left:56px;padding-right:56px}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;padding-block:14px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand{border:0;padding-bottom:6px}
  .side-label,.side-foot{display:none}
  .nav{display:flex;overflow-x:auto;gap:4px}
  .nav button{width:auto;white-space:nowrap;padding:9px 12px;font-size:14px}
  .panel{margin:0;border-radius:22px 22px 0 0}
  .content{padding-block:28px 56px}
}
/* Capçalera de cada pàgina */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px}
.head .label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:17px}
.head .big{font-size:clamp(34px,5vw,52px);font-weight:600;letter-spacing:-.035em;line-height:1.1;font-variant-numeric:tabular-nums}
.head .actions{display:flex;flex-wrap:wrap;gap:8px}
h1,h2,h3{letter-spacing:-.02em;text-wrap:balance;margin:0;font-weight:600}
h1{font-size:30px} h2{font-size:19px} h3{font-size:16px}
/* Targetes */
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:24px;min-width:0}
.sheet > * + *{margin-top:14px}
.list{background:var(--soft);border:1px solid var(--line);border-radius:22px;padding:0 6px 6px;min-width:0}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px 14px;font-weight:600}
.list-head .muted{font-weight:400;font-size:14px}
.list-body{background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list-body > * + *{border-top:1px solid var(--line)}
.list-pad{padding:22px}
.list-pad > * + *{margin-top:14px}
.lrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.4fr) auto 20px;align-items:center;gap:16px;padding:22px 28px;width:100%;background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.lrow:hover{background:var(--soft)}
.lrow .t{font-size:17px;font-weight:500}
.lrow .s{color:var(--muted);font-size:14px}
.lrow .val{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.lrow .mid{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.chev{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2}
@media (max-width:640px){.lrow{grid-template-columns:minmax(0,1fr) auto 18px;padding:18px}.lrow .mid{grid-column:1/-1;grid-row:2}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font-size:14px;color:var(--muted)}
.num,td.n,th.n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.neg{color:var(--bad)} .pos{color:var(--accent-ink)}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:13px}
tr:last-child td{border-bottom:0}
tr.total td{font-weight:600;border-top:1px solid var(--ink);border-bottom:0}
tr.sub td{font-weight:600}
td.ind{padding-left:18px;color:#3d3d43}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;padding:3px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.grey{background:var(--soft);color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:10px;font:500 16px var(--font);border-radius:14px;padding:14px 24px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{background:#2c2c30}
.btn.ghost{background:var(--bg);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.small{padding:9px 14px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.notice{background:var(--warn-soft);color:#5c3600;padding:14px 18px;border-radius:14px;font-size:15px}
.notice.info{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
/* Decisions */
.dec-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media (max-width:1000px){.dec-layout{grid-template-columns:1fr}}
.field{display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:4px 18px;align-items:center;padding:18px 22px}
.field label{font-weight:500;font-size:16px}
.field .help{grid-column:1;font-size:14px;color:var(--muted)}
.field input{grid-row:1/span 2;grid-column:2;width:100%;font:500 16px var(--font);font-variant-numeric:tabular-nums;text-align:right;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink)}
.field input:focus{background:var(--bg);border-color:var(--ink);outline:none}
@media (max-width:520px){.field{grid-template-columns:1fr}.field input{grid-row:auto;grid-column:1}}
.forecast{position:sticky;top:24px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-of-type{border-bottom:0}
.kv b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent)}
.stat{display:grid;gap:2px;padding:18px 20px;background:var(--soft);border-radius:16px}
.stat .v{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chartbox{position:relative;height:270px}
input[type=text],input[type=number],select.field-sel,textarea{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);width:100%}
textarea{font-size:13px;min-height:140px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}
.form-grid label{display:grid;gap:6px;font-size:14px;font-weight:500}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#ffffff;font-weight:600;font-size:15px;flex:none}
.who{display:flex;align-items:center;gap:14px;min-width:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#111113" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18l5-6 4 3 7-9"/><path d="M15 6h5v5"/></svg></span>IPO Emprèn</div>
    <div class="side-label"><label for="roleSel">Veure com</label></div>
    <div class="role"><select id="roleSel"></select></div>
    <div class="side-label" id="navLabel">Secció</div>

    <div class="side-foot"><b id="gameName"></b><span id="quarterTxt"></span><div class="quarter" id="quarterBar" aria-hidden="true"></div></div>
  </aside>
  <div class="panel"><main class="content" id="view"></main></div>
</div>

<style>
.field{grid-template-columns:minmax(0,1fr) minmax(140px,250px)}
.field input[type=text]{text-align:left}
@media (max-width:520px){.field select{grid-row:auto;grid-column:1}}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:14px;cursor:pointer;background:var(--bg)}
.choice:has(input:checked){border-color:var(--ink);background:var(--soft)}
.choice input{margin-top:4px;accent-color:var(--ink);flex:none}
.choice > span{display:grid;gap:2px;min-width:0}
.offer,.offer-head{display:grid;grid-template-columns:minmax(0,2fr) 70px 80px 100px 150px;gap:12px;align-items:center;padding:14px 22px}
.offer-head{padding-block:10px;background:var(--soft)}
.offer .t{font-weight:500;font-size:16px}
.offer .s{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.offer input{text-align:right}
.offer input::placeholder{font-size:13px;color:var(--muted)}
@media (max-width:760px){
  .offer-head{display:none}
  .offer{grid-template-columns:repeat(3,minmax(0,1fr));padding:16px 18px}
  .offer > div:first-child,.offer > div:last-child{grid-column:1/-1}
  .offer .num{text-align:left}
  .offer .num::before{content:attr(data-l);display:block;font-size:12px;color:var(--muted)}
}
ul.fb{margin:0;padding-left:18px;display:grid;gap:10px}
ul.fb.good li::marker{color:var(--ws-ok,#26884f)} ul.fb.bad li::marker{color:var(--bad)} ul.fb.tip li::marker{color:var(--blue)}
.guide{max-width:780px}
.guide > * + *{margin-top:12px}
.guide h2{margin-top:24px}


/* Menú per departaments */
#navLabel{display:none}
.nav{display:grid;gap:12px;margin-top:6px}
.ngroup{display:grid;gap:1px}
.ghead{display:flex;align-items:center;gap:10px;padding:6px 12px;color:var(--side-fg);font:600 13px var(--font);letter-spacing:.09em;text-transform:uppercase}
.ghead svg{width:18px;height:18px;flex:none;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button{gap:12px;padding:7px 12px 7px 40px;font:400 14.5px var(--font);border-radius:10px;opacity:.78}
.nav button[aria-selected="true"]{opacity:1;background:var(--side-2);font-weight:500}
.nav .bullet{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;opacity:.8}
.nav button[aria-selected="true"] .bullet{opacity:1;box-shadow:0 0 0 3px rgba(247,162,27,.3)}
.menu-toggle{display:none}
.side-status{display:flex;align-items:center;gap:8px;color:var(--side-fg);font-size:13px}
.dotst{width:8px;height:8px;border-radius:50%;background:#e0a23a}
.dotst.ok{background:var(--accent)}
.side-btn{width:100%;justify-content:center;padding:11px 14px;font-size:14px;background:var(--side-fg);color:var(--side);border-color:var(--side-fg);margin-top:8px}
.side-btn:hover{background:#ffffff}
#sideAction:empty{display:none}
@media (max-width:860px){
  .menu-toggle{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--side-2);color:var(--side-fg);border:0;border-radius:12px;padding:12px 14px;font:500 15px var(--font);cursor:pointer}
  .nav{display:none;overflow:visible}
  .side.open .nav{display:grid}
  .nav button{width:100%;white-space:normal;padding:9px 12px 9px 40px;font-size:15px}
}
/* Pàgines */
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 22px}
.prow .t{font-weight:500}.prow .s{color:var(--muted);font-size:14px}
.choice.dim{opacity:.6}
.choice > span .small .pill{margin-right:6px}


.intro{max-width:72ch;margin:0}
.pfield{display:grid;gap:6px;padding:4px 0}
.pfield label{font-weight:500;font-size:16px}
.pfield .help,.field .help{font-size:14px;color:var(--muted)}
.pfield textarea,.member input,.interview input,.interview textarea,.pfield input[type=text]{width:100%;font:15px/1.5 var(--font);padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);resize:vertical;min-height:44px}
.pfield textarea:focus,.member input:focus,.interview input:focus,.interview textarea:focus{background:var(--bg);border-color:var(--ink);outline:none}
.member{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center;margin-bottom:10px}
@media (max-width:620px){.member{grid-template-columns:1fr}}
.grpbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:var(--soft);font-size:13.5px;min-width:0}
.grpbar .gb-n{display:inline-flex;align-items:center;gap:8px}
.grpbar svg{width:17px;height:17px;flex:none;stroke:var(--accent-ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.grpbar .linkbtn{margin-left:auto}
@media (max-width:620px){.grpbar{font-size:13px}.grpbar .linkbtn{margin-left:0}}
.member.tsrow{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) auto}
@media (max-width:620px){.member.tsrow{grid-template-columns:1fr}}
.interview{display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
.canvas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line)}

.canvas .cbox:nth-child(7),.canvas .cbox:nth-child(8){grid-column:span 2}
@media (max-width:900px){.canvas{grid-template-columns:repeat(2,minmax(0,1fr))}.canvas .cbox:nth-child(7),.canvas .cbox:nth-child(8){grid-column:span 1}}

.dafo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:700px){.dafo{grid-template-columns:1fr}}
.dafo-f .list-head span:first-child{color:var(--accent-ink)}.dafo-d .list-head span:first-child{color:var(--warn)}.dafo-o .list-head span:first-child{color:var(--blue)}.dafo-a .list-head span:first-child{color:var(--bad)}
.dafo .pfield label{display:none}
.ods{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px}

.tramits input{accent-color:var(--ink);margin-top:5px}
.stepnav{justify-content:space-between}
.sumrow{display:grid;gap:2px;padding:8px 0;border-bottom:1px solid var(--line)}
.sumrow:last-child{border-bottom:0}
.acta{padding:12px 0;border-bottom:1px solid var(--line)}

.linkbtn{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;cursor:pointer}

/* Codi de colors per a les taules */
:root{
  --tn-a:#2d5bea; --tn-a-s:#eef3ff; --tn-a-m:#dce6ff;
  --tn-pn:#13804a; --tn-pn-s:#eaf7ef; --tn-pn-m:#d3efdf;
  --tn-pas:#c2620a; --tn-pas-s:#fff3e6; --tn-pas-m:#fde3c6;
  --tn-in:#13804a; --tn-in-s:#eef8f2; --tn-in-m:#d6f0e1;
  --tn-out:#c0392b; --tn-out-s:#fdf0ee; --tn-out-m:#f9dcd8;
  --tn-res:#5b3fc4; --tn-res-s:#f2effd; --tn-res-m:#e2dbfa;
  --tn-ra4:#2d5bea; --tn-ra5:#7a4fb0;
}
.tablebox{border-radius:14px}
table.fin{border-collapse:separate;border-spacing:0;width:100%;font-size:14px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
table.fin th,table.fin td{padding:10px 12px;border-bottom:1px solid var(--line)}
table.fin thead th{background:var(--soft);color:var(--muted);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line)}
table.fin tbody tr:last-child td{border-bottom:0}
table.fin tbody tr:hover td{filter:brightness(.985)}
table.fin.zebra tbody tr:nth-child(even) td{background:#fafafb}
table.fin td.n,table.fin th.n{font-variant-numeric:tabular-nums}
/* Files per tons: franja de color a l'esquerra i fons suau */
table.fin tr[class*="t-"] td:first-child{box-shadow:inset 4px 0 0 var(--tone)}
.t-a{--tone:var(--tn-a);--tone-s:var(--tn-a-s);--tone-m:var(--tn-a-m)}
.t-pn{--tone:var(--tn-pn);--tone-s:var(--tn-pn-s);--tone-m:var(--tn-pn-m)}
.t-pas{--tone:var(--tn-pas);--tone-s:var(--tn-pas-s);--tone-m:var(--tn-pas-m)}
.t-in{--tone:var(--tn-in);--tone-s:var(--tn-in-s);--tone-m:var(--tn-in-m)}
.t-out{--tone:var(--tn-out);--tone-s:var(--tn-out-s);--tone-m:var(--tn-out-m)}
.t-res{--tone:var(--tn-res);--tone-s:var(--tn-res-s);--tone-m:var(--tn-res-m)}
.t-ra4{--tone:var(--tn-ra4);--tone-s:#eef3ff;--tone-m:#dce6ff}
.t-ra5{--tone:var(--tn-ra5);--tone-s:#f4eeff;--tone-m:#e8dcfa}
table.fin tr[class*="t-"] td{background:var(--tone-s)}
table.fin tr.sec td{background:var(--tone)!important;color:#ffffff;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:8px 12px;box-shadow:none!important}
table.fin tr.sub td{background:var(--tone-m);font-weight:600}
table.fin tr.tot td{background:var(--tone-m);font-weight:700;border-top:2px solid var(--tone);color:var(--ink)}
table.fin tr.soft td{background:var(--soft)}
table.fin th.h-a{background:var(--tn-a);color:#ffffff}
table.fin th.h-p{background:linear-gradient(90deg,var(--tn-pn),var(--tn-pas));color:#ffffff}
table.fin td.negc{background:#fde3e1!important;color:var(--bad);font-weight:600}
table.fin .zero{color:#c4c4ca}
.c-in{color:var(--tn-in)}.c-out{color:var(--tn-out)}.c-pas{color:var(--tn-pas)}.c-a{color:var(--tn-a)}
table.fin tr.tot td.c-in,table.fin tr.tot td.c-out{font-weight:700}

/* Llegenda */
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}

/* Xips */
.chip{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;margin:2px 0}
.chip-in{background:var(--tn-in-s);color:var(--tn-in)}.chip-out{background:var(--tn-out-s);color:var(--tn-out)}.chip-a{background:var(--tn-a-s);color:var(--tn-a)}
table.fin tr.selrow td{background:var(--tn-a-s)}
table.fin tr.selrow td:first-child{box-shadow:inset 4px 0 0 var(--tn-a)}
/* Matriu d'idees: mapa de calor */
table.matrix td.sc{transition:background .2s}
.sc-1{background:#fde3e1!important}.sc-2{background:#ffeedd!important}.sc-3{background:#fff7d6!important}.sc-4{background:#e7f6dc!important}.sc-5{background:#d3efdf!important}
table.matrix tr.best td{background:var(--tn-pn-s)}
table.matrix tr.best td:first-child{box-shadow:inset 4px 0 0 var(--tn-pn)}
.crown{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;background:var(--tn-pn);color:#ffffff;border-radius:6px;padding:1px 6px;margin-right:4px}
.totb{display:inline-block;min-width:34px;text-align:center;background:var(--ink);color:var(--bg);border-radius:8px;padding:2px 8px}
/* Tresoreria: primera columna fixa */
table.fin.treso td:first-child,table.fin.treso th:first-child{position:sticky;left:0;z-index:1;min-width:220px}
table.fin.treso thead th:first-child{background:var(--soft)}
table.fin.treso tr[class*="t-"] td:first-child{background:var(--tone-s)}
table.fin.treso tr.sub td:first-child,table.fin.treso tr.tot td:first-child{background:var(--tone-m)}
/* PESTEL i DAFO amb tons */
.pestel > div:nth-child(3n+2):not(.ph){background:var(--tn-in-s)}
.pestel > div:nth-child(3n):not(.ph){background:var(--tn-out-s)}
.pestel .ph.pos{background:var(--tn-in);color:#ffffff}.pestel .ph.neg{background:var(--tn-out);color:#ffffff}
.dafo-f .list-head{background:var(--tn-pn-s)}.dafo-d .list-head{background:var(--warn-soft)}.dafo-o .list-head{background:var(--tn-a-s)}.dafo-a .list-head{background:var(--tn-out-s)}
/* Notes */
.gchip{display:inline-block;min-width:44px;text-align:center;border-radius:8px;padding:2px 8px;font-weight:700}
.g-hi{background:#dcf5e7;color:#13804a}.g-ok{background:#e0f2f1;color:#0f766e}.g-mid{background:#fff1d6;color:#a85f00}.g-low{background:#fde3e1;color:#b3261e}.g-none{background:#f0f0f2;color:#6b6b72}
.reportview .rnote.g-hi,.reportview .rnote.g-ok,.reportview .rnote.g-mid,.reportview .rnote.g-low,.reportview .rnote.g-none,.reportview .rgrades b[class^="g-"]{background:none}
.reportview .rnote.g-hi,.reportview .rgrades b.g-hi{color:#13804a}.reportview .rnote.g-ok,.reportview .rgrades b.g-ok{color:#0f766e}.reportview .rnote.g-mid,.reportview .rgrades b.g-mid{color:#a85f00}.reportview .rnote.g-low,.reportview .rgrades b.g-low{color:#b3261e}
.reportview .rgrades .ra-ra4{border-top:4px solid var(--tn-ra4)}.reportview .rgrades .ra-ra5{border-top:4px solid var(--tn-ra5)}
.reportview .ract.ra-ra4{border-left:4px solid var(--tn-ra4)}.reportview .ract.ra-ra5{border-left:4px solid var(--tn-ra5)}
.reportview table.fin tr.rasec td{background:var(--tone)!important;color:#ffffff;font-size:12px;font-weight:700;box-shadow:none}
.reportview table.fin tr.rasum td{background:var(--tone-m)!important;font-weight:700}
table.fin.segtbl td{vertical-align:middle}
.segteam{display:flex;align-items:center;gap:12px;min-width:170px}
.slogo{width:44px;height:44px;flex:none;border-radius:11px;background:#ffffff;border:1px solid var(--line);padding:4px;display:grid;place-items:center}
.slogo img{width:100%;height:100%;object-fit:contain}
.slogo b{width:100%;height:100%;border-radius:8px;display:grid;place-items:center;background:var(--tb1);color:#ffffff;font-size:18px}
.slogo.empty{background:var(--soft);border-style:dashed}
table.matrix thead input{min-width:130px}


/* DAFO: el color queda dins de la capsa */
.dafo .list-head{background:none!important}
.dafo-f .list{background:#eef7f1}.dafo-d .list{background:#fdf5e7}.dafo-o .list{background:#eef3fb}.dafo-a .list{background:#fbefee}
.dafo-f .list-head span:first-child,.dafo-d .list-head span:first-child,.dafo-o .list-head span:first-child,.dafo-a .list-head span:first-child{display:inline-flex;align-items:center;gap:8px}
.dafo .list-head span:first-child::before{content:"";width:10px;height:10px;border-radius:3px;background:currentColor}
/* Paleta més sobria per a les taules financeres */
:root{
  --tn-a:#3a5a8c; --tn-a-s:#f5f8fc; --tn-a-m:#e9eff7;
  --tn-pn:#3f7a5c; --tn-pn-s:#f4f9f6; --tn-pn-m:#e6f1eb;
  --tn-pas:#9a6a2f; --tn-pas-s:#fbf7f1; --tn-pas-m:#f4eadc;
  --tn-in:#3f7a5c; --tn-in-s:#f4f9f6; --tn-in-m:#e6f1eb;
  --tn-out:#a54a3f; --tn-out-s:#fcf5f4; --tn-out-m:#f6e6e3;
  --tn-res:#5a5390; --tn-res-s:#f6f5fb; --tn-res-m:#ebe9f5;
}
table.fin tr.sec td{background:var(--tone-m)!important;color:var(--tone);font-size:11.5px;letter-spacing:.07em}
table.fin tr.sec td:first-child{box-shadow:inset 4px 0 0 var(--tone)!important}
table.fin tr.tot td{border-top:1px solid var(--tone)}
table.fin th.h-a,table.fin th.h-p{background:var(--soft);color:var(--ink);font-size:12px;letter-spacing:.05em;border-bottom:2px solid var(--ink)}
.reportview table.fin tr.rasec td{background:var(--tone-m)!important;color:var(--tone)}
/* Apartats tancats */
.nav button.locked{opacity:.45}
.lockic{display:inline-grid;place-items:center;width:14px;flex:none}
.lockic svg{width:13px;height:13px;stroke:var(--side-muted)}
.rotag{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--side-muted);border:1px solid var(--side-2);border-radius:6px;padding:0 5px;flex:none}
.locked-box{display:flex;gap:16px;align-items:flex-start;padding:28px;border:1px dashed var(--line);border-radius:20px;background:var(--soft)}
.locked-box svg{width:28px;height:28px;flex:none;stroke:var(--muted);fill:none;stroke-width:1.7}
.locked-box p{margin:6px 0 0}
.accrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:14px 22px}
.accrow .t{font-weight:500}.accrow .s{color:var(--muted);font-size:13px}
@media (max-width:760px){.accrow{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:8px 12px;font:500 13px var(--font);color:var(--muted);cursor:pointer}
.seg button + button{border-left:1px solid var(--line)}
.seg button.on.s-open{background:var(--accent-soft);color:var(--accent-ink)}
.seg button.on.s-closed{background:var(--ink);color:var(--bg)}
.seg button.on.s-readonly{background:var(--warn-soft);color:var(--warn)}
.accdate{display:grid;gap:2px;font-size:12px;color:var(--muted)}
.accdate input{font:13px var(--font);padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink)}
.accdate input:disabled{opacity:.4}


/* ===== Color per blocs del projecte ===== */
[data-g]{--gc:#4f5bd5;--gs:#eef0fd;--gl:#8f97ff}
[data-g="idea"]{--gc:#c46f1c;--gs:#fdf2e4;--gl:#f2a65a}
[data-g="entorn"]{--gc:#16877a;--gs:#e3f5f2;--gl:#4fc7b6}
[data-g="model"]{--gc:#6b4fd8;--gs:#efebfd;--gl:#a993ff}
[data-g="marxa"]{--gc:#2b63c6;--gs:#e8effc;--gl:#7aa7f5}
[data-g="viab"]{--gc:#26884f;--gs:#e5f4eb;--gl:#5fd08f}
[data-g="mkt"]{--gc:#c43d6f;--gs:#fbe9f0;--gl:#f27fa8}
[data-g="ident"]{--gc:#b5476a;--gs:#f9e8ee;--gl:#e98aa9}
[data-g="lliura"]{--gc:#53606f;--gs:#eef1f4;--gl:#a7b2bf}
[data-g="prof"]{--gc:#b45f06;--gs:#fff1dc;--gl:#fbb040}
[data-g="rec"]{--gc:#53606f;--gs:#eef1f4;--gl:#a7b2bf}
[data-g="admin"]{--gc:#6d3fc0;--gs:#f1ebfb;--gl:#a78bfa}
.nav .ncount{margin-left:auto;min-width:22px;padding:1px 7px;border-radius:99px;background:var(--accent);color:#1c1408;font-size:12px;font-weight:600;text-align:center}

/* Menú: cada bloc amb el seu color */
.ngroup[data-g] .ghead svg{stroke:var(--gl)}
.ngroup[data-g] .ghead{color:#fff}
.ngroup[data-g] .nav button .bullet,.ngroup[data-g] .bullet{background:var(--gl)}
.ngroup[data-g] .bullet.st-part{background:transparent;border-color:var(--gl)}
.ngroup[data-g] button[aria-selected="true"]{box-shadow:inset 3px 0 0 var(--gl)}
.ngroup[data-g] button[aria-selected="true"] .bullet{box-shadow:0 0 0 3px color-mix(in srgb,var(--gl) 30%,transparent)}

/* Capçalera de la pàgina: franja de color suau */
#view[data-g] > .head{background:linear-gradient(120deg,var(--gs) 0%,color-mix(in srgb,var(--gs) 40%,#fff) 60%,#fff 100%);border-radius:24px;padding:26px 28px;border:1px solid color-mix(in srgb,var(--gc) 14%,transparent)}
#view[data-g] > .head .label{display:inline-flex;width:fit-content;background:#fff;color:var(--gc);font-size:14px;font-weight:600;padding:5px 12px;border-radius:999px;border:1px solid color-mix(in srgb,var(--gc) 22%,transparent);margin-bottom:8px}
#view[data-g] > .head .big{color:color-mix(in srgb,var(--gc) 35%,#111113)}
@media (max-width:700px){#view[data-g] > .head{padding:20px 18px;border-radius:18px}}

/* Introducció i targetes */
#view[data-g] .intro{border-left:3px solid var(--gc);padding-left:16px}
#view[data-g] .list:not(.dafo .list) > .list-head{background:none!important;color:color-mix(in srgb,var(--gc) 70%,#111113)}
#view[data-g] .list:not(.dafo .list){background:var(--gs)}
#view[data-g] .list:not(.dafo .list) > .list-head > span:first-child{display:inline-flex;align-items:center;gap:9px;font-weight:600}
#view[data-g] .list:not(.dafo .list) > .list-head > span:first-child::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--gc);flex:none}
#view[data-g] .list:not(.dafo .list){border-color:color-mix(in srgb,var(--gc) 14%,var(--line))}
#view[data-g] .pfield textarea:focus,#view[data-g] .pfield input[type=text]:focus{border-color:var(--gc);box-shadow:0 0 0 3px color-mix(in srgb,var(--gc) 14%,transparent)}
#view[data-g] details.ex{background:var(--gs);border-color:color-mix(in srgb,var(--gc) 18%,transparent)}
#view[data-g] details.ex summary{color:var(--gc);font-weight:600}

/* Inici: cada bloc amb el seu color */
.gtint .list{background:var(--gs)!important}
.gtint .list > .list-head{background:none!important;color:color-mix(in srgb,var(--gc) 70%,#111113)!important}
.gtint .list > .list-head > span:first-child::before{background:var(--gc)!important}
.gtint .list{border-color:color-mix(in srgb,var(--gc) 16%,var(--line))!important}
.gtint .lrow .val{color:var(--gc)}
#view[data-g="proj"] .grid3 .stat:nth-child(1){background:#e5f4eb}
#view[data-g="proj"] .grid3 .stat:nth-child(2){background:#eef0fd}
#view[data-g="proj"] .grid3 .stat:nth-child(3){background:#fdf2e4}

/* ===== Golden Circle ===== */
.golden{display:grid;grid-template-columns:240px minmax(0,1fr);gap:28px;align-items:start}
.gc-svg{width:240px;height:240px;max-width:100%;position:sticky;top:20px}
.gc-svg .c-what{fill:#e8effc;stroke:#b9cdf3;stroke-width:1.5}
.gc-svg .c-how{fill:#fdf2e4;stroke:#efc896;stroke-width:1.5}
.gc-svg .c-why{fill:#26884f}
.gc-svg text{font:700 13px var(--font);letter-spacing:.08em;text-anchor:middle}
.gc-svg text.ts{font-weight:500;font-size:11px;letter-spacing:0}
.gc-svg .tw{fill:#2b63c6}.gc-svg .th{fill:#b0621a}.gc-svg .ty{fill:#fff}
.gc-fields{display:grid;gap:14px;min-width:0}
.gc-f{border-radius:16px;padding:6px 14px 10px;border:1px solid transparent}
.gc-f .pfield label{font-weight:600}
.gc-why{background:#e5f4eb;border-color:#c4e6d1}.gc-why label{color:#1d6b3e}
.gc-how{background:#fdf2e4;border-color:#f3dbbb}.gc-how label{color:#9a5513}
.gc-what{background:#e8effc;border-color:#cbdaf6}.gc-what label{color:#234f9e}
.gc-f textarea{background:#fff!important}
@media (max-width:760px){.golden{grid-template-columns:1fr}.gc-svg{position:static;margin:0 auto;width:220px;height:220px}}

#view[data-g] .lc-proposta{background:var(--gs)!important}

/* Prototip: pujada d'arxius */
.upl{display:inline-flex;align-items:center;gap:10px;width:fit-content;padding:11px 18px;border:1.5px dashed color-mix(in srgb,var(--gc,#111) 45%,transparent);border-radius:14px;background:#fff;color:var(--gc,#111);font-weight:600;font-size:14px;cursor:pointer}
.upl:hover{background:color-mix(in srgb,var(--gc,#111) 6%,#fff)}
.upl:focus-within{outline:2px solid var(--gc,#111);outline-offset:2px}
.upl input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.upl svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.upl.off{opacity:.45;pointer-events:none}
#protoMsg{color:var(--bad,#b3261e)}
#protoMsg:empty{display:none}
#protoFiles:empty{display:none}
#protoFiles{display:grid;gap:14px;padding:0 4px 4px}
.pgal{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.pimg{margin:0;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:grid}
.pimg img{width:100%;max-height:420px;object-fit:contain;background:#f6f6f7;display:block}
.pimg figcaption{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;font-size:13px;color:var(--muted)}
.pimg figcaption span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pdocs{display:grid;gap:8px}
.pdoc{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.pdoc > div{flex:1}
.pdoc b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:14px}
.pext{flex:none;display:grid;place-items:center;width:44px;height:44px;border-radius:10px;background:var(--gs,#eee);color:var(--gc,#111);font-weight:700;font-size:11px}
@media (max-width:600px){.pdoc{flex-wrap:wrap}.pgal{grid-template-columns:1fr}}
.sumrow + .pgal,.pgal + .sumrow{margin-top:10px}


/* Lean Canvas sostenible: dues caselles a sota de costos i ingressos */
.leancanvas{grid-template-areas:"pr so pv av se" "pr me pv ca se" "co co co in in" "cs cs cs bs bs"}
.lc-costamb{grid-area:cs}.lc-benamb{grid-area:bs}
.leancanvas .lc-sost{background:#eef7f1;position:relative;padding-top:34px}
.sosttag{position:absolute;top:10px;left:14px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#26884f;display:inline-flex;align-items:center;gap:6px}
.sosttag::before{content:"";width:8px;height:8px;border-radius:2px;background:#26884f}
.lc-sost .pfield textarea{background:#fff}
.benamb{display:grid;grid-template-columns:1fr;gap:2px}
@media (max-width:1000px){.leancanvas{grid-template-areas:"pr so" "pv pv" "se ca" "me av" "co in" "cs bs"}.benamb{grid-template-columns:1fr}}
@media (max-width:560px){.leancanvas{grid-template-areas:"pr" "so" "pv" "se" "ca" "me" "av" "co" "in" "cs" "bs"}}

.lc-sost .pfield > label{font-weight:700}

.vlink{margin-top:14px;padding:16px;border-radius:14px;background:#fff;border:1.5px dashed color-mix(in srgb,var(--gc,#111) 40%,transparent)}
.vlink input[type=url]{width:100%;font:15px/1.5 var(--font);padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink)}
.vlink input[type=url]:focus{background:#fff;border-color:var(--gc,#111);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--gc,#111) 14%,transparent)}
.vlink .bad,.vlink .small.bad{color:var(--bad,#b3261e)}
#vmsg a{color:var(--gc,#111);font-weight:600}


.aipick{background:#f1edfe;border:1px solid #e1d9fb;border-radius:18px;padding:16px 18px}
.aipick-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.aipick-h:only-child{margin-bottom:0}
.aiseg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;background:none;padding:0;border:0}
.aiseg button{display:grid;gap:2px;text-align:left;padding:10px 14px;border-radius:12px;border:1px solid #e1d9fb;background:#fff;color:var(--ink);font:600 14px var(--font);cursor:pointer}
.aiseg button small{font-weight:400;font-size:12px;color:var(--muted)}
.aiseg button.on{border-color:#6b4fd8;box-shadow:inset 0 0 0 1px #6b4fd8;background:#fff}
.aiseg button.on::after{content:"✓";position:absolute}
.aiseg button{position:relative}
.aiseg button.on::after{top:8px;right:12px;color:#6b4fd8;font-weight:700}
.aiseg button:focus-visible{outline:2px solid #6b4fd8;outline-offset:2px}
@media (max-width:800px){.aiseg{grid-template-columns:1fr 1fr}}


.pdfbox{position:fixed;left:-30000px;top:0;width:720px;background:#fff;z-index:-1}
.reportview.pdfrep{background:#fff!important;padding:0!important;margin:0!important;max-width:none!important;border:0!important;border-radius:0!important;box-shadow:none!important}
.pdfbox .ract{break-inside:auto}


/* Versió connectada */
#syncPill{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;font:600 13px var(--font);padding:7px 12px;border-radius:999px;background:#fff;border:1px solid var(--line);box-shadow:0 4px 14px rgba(0,0,0,.08);color:var(--muted);transition:opacity .3s}
#syncPill.sp-idle,#syncPill:empty{opacity:0;pointer-events:none}
#syncPill.sp-saved{color:#1d6b3e}
#syncPill.sp-error{color:var(--bad,#b3261e);border-color:currentColor}
body.is-student .role,body.is-student .side-label:has(+ .role){display:none}
.cloud-load{display:flex;align-items:center;gap:10px;padding:40px 0;color:var(--muted)}
.joinlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:16px}
.joinlist .btn{justify-content:flex-start;padding:16px 18px;font-size:16px}
.rost{display:grid;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.rost:last-of-type{border-bottom:0}
.rostrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(140px,220px) auto;gap:8px;align-items:center;font-size:14px}
.rostwho{display:flex;flex-direction:column;min-width:0}
.rostwho > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rostrow .pill{font-size:12px;padding:1px 8px}
.rostbtn{display:flex;gap:6px}
.adrow{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px}
.adrow .rostwho{flex:1 1 180px}
.adrow .pill,.btn .pill{font-size:12px;padding:1px 8px}
.admsg{font-size:14px;padding:8px 12px;border-radius:10px;background:var(--soft);white-space:pre-wrap}
@media (max-width:620px){.adrow{flex-wrap:wrap}}
.invform{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
@media (max-width:620px){.invform{grid-template-columns:1fr}}
@media (max-width:600px){.rostrow{grid-template-columns:1fr auto}.rostrow select{grid-column:1/-1;grid-row:2}}


.sideuser{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;font-size:12px;color:var(--side-fg,#bbb);opacity:.85}
.sideuser span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.sideuser .linkbtn{color:inherit;font-size:12px;flex:none}
.glist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin:18px 0 24px}
.gcard{display:grid;gap:6px;padding:18px 20px;border:1px solid var(--line);border-radius:18px;background:#fff;color:var(--ink);text-decoration:none;transition:border-color .15s,box-shadow .15s}
.gcard:hover{border-color:#e08a0b;box-shadow:0 4px 18px rgba(224,138,11,.14)}
.gcard b{font-size:17px}
.linkbox{display:flex;gap:8px}
.linkbox input{flex:1;min-width:0;font:14px var(--font);padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink)}
.notice.expwarn{background:#fdf2e4;border-color:#f3dbbb;color:#7a4a12;margin-bottom:16px}

body.cloud-msg .side-label,body.cloud-msg .role{display:none}

.dashbtn{display:flex;align-items:center;gap:8px;margin:4px 0 14px;padding:10px 14px;border-radius:12px;background:#c26a00;color:#fff;font:600 14px var(--font);text-decoration:none}
.dashbtn:hover{background:#a85a00}
.dashbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
/* Botó «Gestiona l'alumnat»: sota «Els meus grups», en verd suau */
.dashbtn.alt{background:color-mix(in srgb,#f59e0b 13%,var(--bg));color:var(--accent-ink);border:1px solid color-mix(in srgb,#f59e0b 40%,transparent)}
.dashbtn.alt:hover,.dashbtn.alt.on{background:#c26a00;color:#fff}
.dashbtn+.dashbtn{margin-top:-6px}
.dashbtn .dcount{margin-left:auto;min-width:22px;padding:1px 7px;border-radius:99px;background:#c26a00;color:#fff;font-size:12px;text-align:center}
.dashbtn .dcount:empty{display:none}
.dashbtn.alt:hover .dcount,.dashbtn.alt.on .dcount{background:#fff;color:#a85a00}
.rlog{grid-column:1/-1;margin:-2px 0 8px}
.rlog details{margin-top:4px}
.rlog summary{cursor:pointer;color:var(--accent-ink);width:max-content;max-width:100%}
.rlog table{margin-top:6px;border-collapse:collapse;font-size:13px}
.rlog th,.rlog td{text-align:left;padding:3px 14px 3px 0;border-bottom:1px solid var(--line)}
.rlog th{font-weight:600;color:var(--ink)}
.qrbig{position:fixed;inset:0;z-index:100;background:rgba(10,10,12,.72);display:grid;place-items:center;padding:16px}
.qrbox{background:#fff;color:#111113;border-radius:24px;padding:24px;display:grid;gap:12px;justify-items:center;text-align:center;width:min(560px,100%);max-height:100%;overflow:auto}
.qrbox b{font-size:20px}
.qrimg{width:min(420px,72vw,62vh);aspect-ratio:1;display:grid;place-items:center}
.qrimg svg{width:100%;height:100%}
.qrbox p{margin:0;color:#52525b}
.qrbox code{font-size:15px;word-break:break-all;background:#f4f4f5;padding:6px 10px;border-radius:8px}
.cmsg{white-space:pre-wrap;font:14px/1.5 var(--font);padding:12px 14px;border:1px dashed var(--line);border-radius:12px;background:var(--soft);margin:10px 0}
.gcard{gap:8px}
.gcard .gtitle{color:var(--ink);text-decoration:none}
.gcard .gtitle:hover b{text-decoration:underline}
.gstats{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted);margin-top:4px}
.gstats b{color:var(--ink);font-size:16px}
.gbar{height:6px;border-radius:99px;background:#eef1f4;overflow:hidden}
.gbar span{display:block;height:100%;background:#26884f;transition:width .4s}
.gact{margin-top:6px}
.glist{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}

a.btn{text-decoration:none}

/* Imatges del prototip sense franges */
.pimg{background:#fff}
.pimg img{width:auto;max-width:100%;height:auto;max-height:520px;margin:0 auto;background:#fff;object-fit:contain}

/* ===== Revisió dels projectes ===== */
.rtabs{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;margin-top:4px}
.rtab{flex:0 0 auto;min-width:190px;display:grid;gap:4px;text-align:left;padding:12px 16px;border-radius:16px;border:1px solid var(--line);background:#fff;cursor:pointer;font:inherit;color:var(--ink);position:relative}
.rtab b{font-size:15px}.rtab span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.rtab i{display:block;height:5px;border-radius:9px;background:#eef1f4;overflow:hidden;margin-top:4px}.rtab i u{display:block;height:100%;background:#f08a00;text-decoration:none}
.rtab em{position:absolute;top:12px;right:14px;font-style:normal;font-size:12px;font-weight:700;color:#b45f06}
.rtab.on{border-color:#e08a0b;box-shadow:0 0 0 2px #e08a0b inset;background:#fff8ec}
.rsum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}
.rsum-i{display:grid;gap:2px;padding:14px 16px;border-radius:16px;background:var(--soft)}
.rsum-i b{font-size:28px;letter-spacing:-.02em}.rsum-i span{font-size:13px;color:var(--muted)}
.rsum-i.ok{background:#e5f4eb}.rsum-i.ok b{color:#1d6b3e}
.rsum-i.warn{background:#fdf2e4}.rsum-i.warn b{color:#9a5513}
.rsum-i.pend{background:#e8effc}.rsum-i.pend b{color:#234f9e}
.rfilters{display:inline-flex;gap:4px;padding:4px;border-radius:14px;background:var(--soft);margin-bottom:16px;flex-wrap:wrap}
.rfilters button{border:0;background:none;padding:8px 14px;border-radius:10px;font:600 14px var(--font);color:var(--muted);cursor:pointer}
.rfilters button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.rlayout{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
.rnav{position:sticky;top:16px;display:grid;gap:12px;max-height:calc(100vh - 32px);overflow:auto;padding-right:4px}
.rnav-g{display:grid;gap:2px}
.rnav-g > span{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--gc);padding:0 8px 2px}
.rnav-i{display:flex;align-items:center;gap:8px;text-align:left;border:0;background:none;padding:6px 8px;border-radius:8px;font:13px var(--font);color:var(--ink);cursor:pointer}
.rnav-i:hover{background:var(--soft)}.rnav-i.faded{opacity:.4}
.rdot{flex:none;width:10px;height:10px;border-radius:50%;background:#cbd5e1}
.rdot.ok{background:#26884f}.rdot.warn{background:#d97706}.rdot.pend{background:#3b82f6}.rdot.none{background:#e5e7eb;border:1px solid #cbd5e1}
.rcards{display:grid;gap:16px;min-width:0}
.rcard{border:1px solid var(--line);border-left:5px solid #cbd5e1;border-radius:18px;background:#fff;overflow:hidden;scroll-margin-top:16px}
.rcard.st-correcte{border-left-color:#26884f}.rcard.st-millorar{border-left-color:#d97706}.rcard.st-pend{border-left-color:#3b82f6}.rcard.st-none{border-left-color:#e5e7eb}
.rcard > header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:16px 20px 12px;background:var(--gs)}
.rcard h3{margin:2px 0;font-size:18px;letter-spacing:-.01em}
.rblk{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--gc)}
.rfill{flex:none;font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:#fff;color:var(--muted);border:1px solid var(--line)}
.rfill.done{color:#1d6b3e;border-color:#c4e6d1}.rfill.none{color:#b3261e}
.rbody{padding:6px 20px 12px}
.rbody .sumrow{grid-template-columns:200px minmax(0,1fr);gap:16px;align-items:baseline;padding:10px 0}
.rbody .sumrow > span{font-weight:600;color:var(--muted)}
.rbody .dlogo{max-width:96px;margin:10px 0}
.rrev{display:grid;gap:10px;padding:14px 20px 18px;background:#fafafa;border-top:1px solid var(--line)}
.rbtns{display:flex;gap:8px;flex-wrap:wrap}
.rb{border:1.5px solid var(--line);background:#fff;padding:9px 16px;border-radius:12px;font:600 14px var(--font);cursor:pointer;color:var(--ink)}
.rb.ok:hover,.rb.ok.on{border-color:#26884f;color:#1d6b3e}.rb.ok.on{background:#e5f4eb}
.rb.warn:hover,.rb.warn.on{border-color:#d97706;color:#9a5513}.rb.warn.on{background:#fdf2e4}
.rquick{display:flex;gap:6px;flex-wrap:wrap}
.rquick button{border:1px dashed #cbd5e1;background:#fff;border-radius:99px;padding:4px 10px;font:12.5px var(--font);color:var(--muted);cursor:pointer}
.rquick button:hover{border-color:#e08a0b;color:#a85a00}
.rrev textarea{width:100%;font:14px/1.5 var(--font);padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;resize:vertical}
.rrev textarea:focus{outline:none;border-color:#e08a0b;box-shadow:0 0 0 3px rgba(224,138,11,.14)}
@media (max-width:900px){.rlayout{grid-template-columns:1fr}.rnav{display:none}.rsum{grid-template-columns:1fr 1fr}.rbody .sumrow{grid-template-columns:1fr;gap:2px}}


/* Subapartats dins d'un apartat */
.subsec + .subsec{margin-top:14px}
.subh{display:flex;align-items:center;gap:8px;margin:14px 0 2px;font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--gc,#26884f)}
.subh::after{content:"";flex:1;height:1px;background:color-mix(in srgb,var(--gc,#26884f) 25%,transparent)}
.subsec:first-child .subh{margin-top:6px}
.reportview .rsub{margin:12px 0 4px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}


/* Estat de la feina: vermell en edició, blau enviat, verd correcte, taronja a millorar */
:root{--ws-edit:#dc2626;--ws-edit-s:#fdecec;--ws-sent:#2563eb;--ws-sent-s:#e8effc;--ws-ok:#26884f;--ws-ok-s:#e5f4eb;--ws-warn:#d97706;--ws-warn-s:#fdf2e4;--ws-none:#cbd5e1}
.rdot.edit,.wsdot.edit{background:var(--ws-edit)}.rdot.sent,.wsdot.sent{background:var(--ws-sent)}.rdot.correcte,.wsdot.correcte{background:var(--ws-ok)}.rdot.millorar,.wsdot.millorar{background:var(--ws-warn)}.rdot.none,.wsdot.none{background:#e5e7eb;border:1px solid var(--ws-none)}
.rcard.st-edit{border-left-color:var(--ws-edit)}.rcard.st-sent{border-left-color:var(--ws-sent)}.rcard.st-correcte{border-left-color:var(--ws-ok)}.rcard.st-millorar{border-left-color:var(--ws-warn)}.rcard.st-none{border-left-color:#e5e7eb}
.rbadges{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.wsbadge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;white-space:nowrap}
.wsbadge.edit{background:var(--ws-edit-s);color:var(--ws-edit)}.wsbadge.sent{background:var(--ws-sent-s);color:var(--ws-sent)}.wsbadge.correcte{background:var(--ws-ok-s);color:#1d6b3e}.wsbadge.millorar{background:var(--ws-warn-s);color:#9a5513}.wsbadge.none{background:#f1f5f9;color:#64748b}
.rsum-i.sent{background:var(--ws-sent-s)}.rsum-i.sent b{color:var(--ws-sent)}
.rsum-i.edit{background:var(--ws-edit-s)}.rsum-i.edit b{color:var(--ws-edit)}
.pill.ws-edit{background:var(--ws-edit-s);color:var(--ws-edit)}.pill.ws-sent{background:var(--ws-sent-s);color:var(--ws-sent)}.pill.ws-correcte{background:var(--ws-ok-s);color:#1d6b3e}.pill.ws-millorar{background:var(--ws-warn-s);color:#9a5513}.pill.ws-none{background:#f1f5f9;color:#64748b}
.nav .bullet.ws{opacity:1;border:0;width:8px;height:8px}
.nav .bullet.ws-edit{background:#f87171!important}.nav .bullet.ws-sent{background:#60a5fa!important}.nav .bullet.ws-correcte{background:#4ade80!important}.nav .bullet.ws-millorar{background:#fbbf24!important}.nav .bullet.ws-none{background:transparent!important;border:1.5px solid #6b7280!important;width:8px;height:8px}
/* Barra d'enviament de l'alumnat */
.sendbar{display:flex;align-items:center;gap:14px;padding:16px 18px;border-radius:16px;border:1.5px solid;margin-top:8px}
.sendbar .sb-t{flex:1;font-size:14.5px;line-height:1.5}
.sendbar .wsdot{flex:none;width:14px;height:14px;border-radius:50%}
.sendbar.ws-edit{background:var(--ws-edit-s);border-color:#f5b5b5;color:#7f1d1d}
.sendbar.ws-sent{background:var(--ws-sent-s);border-color:#bcd0f7;color:#1e3a8a}
.sendbar.ws-correcte{background:var(--ws-ok-s);border-color:#c4e6d1;color:#14532d}
.sendbar.ws-millorar{background:var(--ws-warn-s);border-color:#f3dbbb;color:#7c2d12}
.sendbar.ws-none{background:#f8fafc;border-color:#e2e8f0;color:#475569}
.sendbar.ws-edit .btn{background:var(--ws-edit);border-color:var(--ws-edit)}
@media (max-width:640px){.sendbar{flex-wrap:wrap}.sendbar .btn{width:100%;justify-content:center}}
.accdates{display:flex;gap:10px;flex-wrap:wrap}

.wsbadge.rvb{background:#fff;border:1.5px solid currentColor}.wsbadge.rvb.correcte{color:#1d6b3e}.wsbadge.rvb.millorar{color:#b45309}
/* Qui ha escrit cada cosa */
.whochips{display:inline-flex;flex-wrap:wrap;gap:6px;vertical-align:middle}
.whochip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;line-height:1.2;padding:3px 10px;border-radius:999px;color:var(--wc);background:color-mix(in srgb,var(--wc) 12%,#fff);white-space:nowrap}
.whochip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--wc)}
.whochips.mini{display:flex;gap:4px;margin-top:4px}
.whochips.mini .whochip{font-size:11px;padding:1px 7px;gap:4px}
.whochips.mini .whochip::before{width:6px;height:6px}
.whot{background:color-mix(in srgb,var(--wc) 13%,transparent);box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--wc) 70%,transparent);border-radius:3px}

/* ================= SISTEMA DE DISSENY v2 =================
   Capa final: grisos zinc, vores subtils, ombres en capes, radis generosos i microinteraccions.
   Va al final perquè mani sobre les regles anteriors; la lògica no canvia. */
:root{
  --side:#efeff1; --side-2:#e4e4e7; --side-3:#ffffff; --side-fg:#18181b; --side-muted:#71717a;
  --side-hover:rgba(24,24,27,.045); --side-ring:rgba(24,24,27,.08); --side-border:#d4d4d8; --side-sel:#ffffff;
  --bg:#ffffff; --canvas:#f8f8f9; --soft:#f4f4f5; --ink:#18181b; --ink-2:#3f3f46; --muted:#71717a;
  --line:rgba(228,228,231,.85); --line-2:#d4d4d8;
  --accent:#f59e0b; --accent-ink:#b45309; --accent-soft:#fff6e6;
  --blue:#2563eb; --blue-soft:#eff4ff;
  --warn:#b45309; --warn-soft:#fff7e6; --bad:#dc2626; --bad-soft:#fef2f2;
  --sh-xs:0 1px 2px rgba(24,24,27,.05);
  --sh-sm:0 1px 2px rgba(24,24,27,.04),0 1px 3px rgba(24,24,27,.06);
  --sh-md:0 2px 4px rgba(24,24,27,.04),0 6px 16px -2px rgba(24,24,27,.08);
  --sh-lg:0 4px 8px rgba(24,24,27,.04),0 16px 36px -6px rgba(24,24,27,.14);
  --ring:0 0 0 3px rgba(37,99,235,.18);
  --r-md:10px; --r-lg:12px; --r-xl:16px; --r-2xl:20px;
  --ease:cubic-bezier(.2,.8,.2,1); --t-fast:.15s var(--ease); --t:.25s var(--ease);
}
body{background:var(--side);font-size:15px;letter-spacing:-.003em;text-rendering:optimizeLegibility}
::selection{background:color-mix(in srgb,var(--blue) 18%,transparent)}
*{scrollbar-width:thin;scrollbar-color:#d4d4d8 transparent}
.side{scrollbar-color:var(--side-3) transparent}

/* Menú lateral */
.brand{font-size:19px;letter-spacing:-.025em;border-color:var(--side-2)}
.logo{border-radius:10px;background:linear-gradient(145deg,#fcc14d,#f08a00);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 14px -2px rgba(240,138,0,.45)}
.role select{background:var(--side-3);border:1px solid var(--side-border);border-radius:var(--r-md);transition:border-color var(--t-fast),background var(--t-fast);cursor:pointer}
.role select:hover{border-color:var(--side-muted)}
.ghead{color:var(--side-muted)!important;font-size:11.5px;letter-spacing:.08em;padding:6px 12px 4px}
.nav button{border-radius:8px;transition:background var(--t-fast),opacity var(--t-fast),color var(--t-fast),transform .1s var(--ease)}
.nav button:hover{background:var(--side-hover);opacity:1}
.nav button[aria-selected="true"]{background:var(--side-sel);box-shadow:inset 0 0 0 1px var(--side-ring),var(--sh-xs)!important;opacity:1}
.ngroup[data-g] button[aria-selected="true"]{box-shadow:inset 2px 0 0 var(--gl),inset 0 0 0 1px var(--side-ring),var(--sh-xs)!important}
.nav button:active,.menu-toggle:active{transform:scale(.98)}
.side-foot{border-color:var(--side-2)}
.quarter .q{transition:background var(--t)}
.side-btn{border-radius:var(--r-md);box-shadow:var(--sh-sm)}

/* Plafó principal */
.panel{background:var(--canvas);border:1px solid var(--line);box-shadow:var(--sh-md);border-radius:18px}
.content{gap:24px}

/* Capçalera de pàgina */
.head .big{letter-spacing:-.04em;font-weight:650}
#view[data-g] > .head{background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--gs) 90%,#fff) 0%,#fff 62%);border:1px solid var(--line);border-radius:var(--r-2xl);box-shadow:var(--sh-sm);position:relative;overflow:hidden}
#view[data-g] > .head::after{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--gc) 45%,transparent),transparent)}
#view[data-g] > .head .label{font-size:12.5px;padding:4px 11px;box-shadow:var(--sh-xs);border-color:color-mix(in srgb,var(--gc) 20%,var(--line))}
#view[data-g] > .head .big{color:var(--ink)}
.tbanner{border-radius:var(--r-2xl);box-shadow:var(--sh-md);border-left-width:4px}
.head .hlogo{box-shadow:var(--sh-md);border:1px solid var(--line)}

/* Targetes */
.sheet,.list,.reportview,.rcard,.gcard,.rtab,.pimg,.pdoc,.locked-box,.aipick{box-shadow:var(--sh-sm)}
.sheet{border-radius:var(--r-2xl);border-color:var(--line)}
.list{background:var(--soft);border-color:var(--line);border-radius:var(--r-2xl);padding:0 5px 5px}
#view[data-g] .list:not(.dafo .list){background:color-mix(in srgb,var(--gs) 55%,var(--soft))}
.list-head{padding:14px 18px 12px;font-size:14.5px}
.list-body{border-color:var(--line);border-radius:var(--r-xl);box-shadow:var(--sh-xs)}
.lrow{padding:18px 24px;transition:background var(--t-fast)}
.lrow:hover{background:#fafafa}
.lrow .t{font-size:16px}
.lrow .val{font-size:15px;color:var(--ink-2)}
.chev{stroke:var(--muted);transition:transform var(--t-fast),stroke var(--t-fast)}
.lrow:hover .chev{transform:translateX(3px);stroke:var(--ink)}
.lrow:active{background:var(--soft)}
.gcard,.rtab,.choice,.odsi,.rcell,.pdoc,.pimg,.interview{transition:transform var(--t),box-shadow var(--t),border-color var(--t),background var(--t)}
.gcard:hover,.rtab:hover,.pdoc:hover,.pimg:hover{transform:translateY(-2px);box-shadow:var(--sh-md);border-color:var(--line-2)}
.gcard:hover{border-color:color-mix(in srgb,#e08a0b 50%,var(--line))}
.choice,.odsi{box-shadow:var(--sh-xs)}
.choice:hover,.odsi:hover{border-color:var(--line-2);box-shadow:var(--sh-sm)}
.choice:has(input:checked),.odsi:has(input:checked){border-color:var(--ink);background:var(--bg);box-shadow:0 0 0 1px var(--ink),var(--sh-sm)}
.gcard,.rtab,.rcard,.reportview{border-color:var(--line);border-radius:var(--r-2xl)}
.rtab.on{box-shadow:0 0 0 2px #e08a0b inset,var(--sh-md)}
.interview{border-color:var(--line);border-radius:var(--r-xl);background:var(--bg);box-shadow:var(--sh-xs)}
details.ex{border-radius:var(--r-lg);transition:box-shadow var(--t)}
details.ex[open]{box-shadow:var(--sh-sm)}
details.ex summary{list-style-position:inside}

/* Indicadors (KPI) */
.stat{background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--kc,#a1a1aa) 11%,transparent),transparent 60%),var(--bg)!important;border:1px solid var(--line);border-radius:var(--r-xl);box-shadow:var(--sh-sm);padding:18px 20px;gap:4px;position:relative;transition:transform var(--t),box-shadow var(--t)}
.stat:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
.stat > .muted.small:first-child{font-size:12px;font-weight:500;text-transform:uppercase;letter-spacing:.06em}
.stat .v{font-size:30px;letter-spacing:-.035em;line-height:1.15}
.grid3 .stat:nth-child(1){--kc:#22b864}.grid3 .stat:nth-child(2){--kc:#4f5bd5}.grid3 .stat:nth-child(3){--kc:#e08a2b}.grid3 .stat:nth-child(4){--kc:#2563eb}
.grid2 .stat:nth-child(1){--kc:var(--tn-ra4)}.grid2 .stat:nth-child(2){--kc:var(--tn-ra5)}
.trend{display:inline-flex;align-items:center;gap:4px;width:fit-content;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);box-shadow:inset 0 0 0 1px var(--line)}
.trend.up{background:var(--accent-soft);color:var(--accent-ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--accent) 22%,transparent)}
.trend.warn{background:var(--warn-soft);color:var(--warn);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--warn) 20%,transparent)}
.trend svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.stack{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--soft);gap:2px;margin-top:4px}
.stack i{display:block;height:100%;border-radius:99px}
.stack .s-ok{background:var(--ws-ok)}.stack .s-sent{background:var(--ws-sent)}.stack .s-warn{background:var(--ws-warn)}.stack .s-edit{background:var(--ws-edit)}
.bar,.gbar,.minibar{background:#ececef;border-radius:99px;height:6px}
.bar span,.gbar span,.minibar span{border-radius:99px;background:linear-gradient(90deg,#fcc14d,#f08a00)}
.rsum-i{border:1px solid var(--line);box-shadow:var(--sh-sm);border-radius:var(--r-xl);transition:transform var(--t),box-shadow var(--t)}
.rsum-i:hover{transform:translateY(-2px);box-shadow:var(--sh-md)}
.rsum-i b{font-size:30px;letter-spacing:-.035em;font-variant-numeric:tabular-nums}

/* Badges d'estat */
.pill,.wsbadge,.chip,.rfill{border-radius:999px;font-size:12.5px;font-weight:550;padding:2px 9px;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 18%,transparent)}
.pill::before{width:6px;height:6px}
.pill.grey,.wsbadge.none,.pill.ws-none{background:#f4f4f5;color:#52525b}
.gchip{border-radius:999px;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 16%,transparent)}
.whochip{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--wc) 20%,transparent)}
.actcode,.reportview .rcode,.totb{border-radius:6px;background:var(--ink)}

/* Botons */
.btn{font-size:15px;padding:11px 18px;gap:8px;border-radius:var(--r-lg);border-color:#18181b;background:linear-gradient(180deg,#2e2e33,#18181b);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 1px 2px rgba(24,24,27,.25),0 2px 6px -1px rgba(24,24,27,.18);transition:transform .12s var(--ease),box-shadow var(--t-fast),background var(--t-fast),border-color var(--t-fast),opacity var(--t-fast)}
.btn:hover{background:linear-gradient(180deg,#3a3a40,#232327);transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 2px 4px rgba(24,24,27,.2),0 8px 18px -4px rgba(24,24,27,.28)}
.btn.ghost{background:var(--bg);color:var(--ink);border-color:var(--line-2);box-shadow:var(--sh-xs)}
.btn.ghost:hover{background:#fafafa;border-color:#a1a1aa;box-shadow:var(--sh-sm)}
.btn.small{padding:7px 12px;font-size:13.5px;border-radius:var(--r-md)}
.btn:active,.lvl:active,.rb:active,.seg button:active,.rfilters button:active,.aiseg button:active,.rquick button:active,.upl:active,.dashbtn:active,.linkbtn:active,.joinlist .btn:active{transform:scale(.96)}
.btn:disabled,.btn:disabled:hover{transform:none;box-shadow:none}
.side-btn{background:var(--side-fg);color:var(--side);border-color:var(--side-fg)}
.side-btn:hover{background:var(--side-fg);opacity:.88}
.sendbar.ws-edit .btn{background:var(--ws-edit);border-color:var(--ws-edit)}
.lvl,.rb,.seg button,.rfilters button,.aiseg button,.rquick button,.upl,.dashbtn,.rnav-i{transition:background var(--t-fast),border-color var(--t-fast),color var(--t-fast),box-shadow var(--t-fast),transform .12s var(--ease)}
.lvl{border-radius:var(--r-md);box-shadow:var(--sh-xs)}
.lvl:hover{border-color:var(--line-2);background:#fafafa}
.rb{border-width:1px;box-shadow:var(--sh-xs)}
.seg{border-color:var(--line-2);border-radius:var(--r-md);box-shadow:var(--sh-xs)}
.rfilters{background:#ececef;border-radius:var(--r-lg);padding:3px}
.rfilters button{border-radius:9px}
.rfilters button:hover:not(.on){color:var(--ink)}
.rfilters button.on{box-shadow:var(--sh-sm)}
.dashbtn{box-shadow:var(--sh-sm)}
.dashbtn:hover{box-shadow:var(--sh-md)}

/* Camps de formulari */
input[type=text],input[type=number],input[type=url],input[type=email],input[type=date],select.field-sel,textarea,.field input,.pfield textarea,.pfield input[type=text],.vlink input[type=url],.member input,.interview input,.interview textarea,.irow input,.trow input,.acttab input,.acttab textarea,.notein input,[data-gcom],.review textarea,.rrev textarea,.linkbox input,.accdate input,#mPrompt,#mResp,table.matrix input{background:var(--bg);border:1px solid var(--line-2);box-shadow:var(--sh-xs);transition:border-color var(--t-fast),box-shadow var(--t-fast)}
input[type=text]:hover,input[type=number]:hover,textarea:hover,select.field-sel:hover{border-color:#a1a1aa}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue)!important;box-shadow:var(--ring)!important}
#view[data-g] .pfield textarea:focus,#view[data-g] .pfield input[type=text]:focus{border-color:var(--gc)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--gc) 16%,transparent)!important}
input:disabled,textarea:disabled,select:disabled{background:var(--soft);box-shadow:none}
.field{padding:16px 20px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}

/* Taules */
table.fin{border-color:var(--line);border-radius:var(--r-xl);box-shadow:var(--sh-xs)}
table.fin thead th{background:#fafafa;color:var(--muted);font-size:11px;letter-spacing:.07em}
table.fin tbody td{transition:background var(--t-fast)}
table.fin tbody tr:hover td{filter:none;background:color-mix(in srgb,var(--tone-s,#fff) 70%,#f4f4f5)}
th,td{border-color:var(--line)}
tbody tr{transition:background var(--t-fast)}
.rcell{border-radius:var(--r-lg)}
.rcell:hover{border-color:var(--line-2);box-shadow:var(--sh-sm)}

/* Avisos i diversos */
.notice{border-radius:var(--r-lg);border:1px solid color-mix(in srgb,var(--warn) 18%,transparent);box-shadow:var(--sh-xs)}
.notice.info{background:var(--bg);border-color:var(--line)}
.sendbar{border-width:1px;border-radius:var(--r-xl);box-shadow:var(--sh-sm)}
.locked-box{border-radius:var(--r-2xl);background:var(--bg)}
#toast{background:rgba(24,24,27,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:var(--r-lg);box-shadow:var(--sh-lg);transition:opacity .25s var(--ease),transform .25s var(--ease)}
#syncPill{background:rgba(255,255,255,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--sh-md);border-color:var(--line)}
.upl{border-radius:var(--r-lg)}
.upl:hover{box-shadow:var(--sh-sm)}
.rcard{transition:box-shadow var(--t)}
.rcard:hover{box-shadow:var(--sh-md)}
.rrev{background:#fafafa}

/* Entrada de cada pàgina: fosa + petit desplaçament, esglaonat */
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#view.vin > *{animation:vin .42s var(--ease) both}
#view.vin > :nth-child(2){animation-delay:.04s}#view.vin > :nth-child(3){animation-delay:.08s}#view.vin > :nth-child(4){animation-delay:.12s}
#view.vin > :nth-child(5){animation-delay:.16s}#view.vin > :nth-child(6){animation-delay:.2s}#view.vin > :nth-child(n+7){animation-delay:.24s}
#view.vin .bar span,#view.vin .gbar span,#view.vin .minibar span,#view.vin .stack i{transform-origin:left;animation:grow .8s .15s var(--ease) both}
@media (max-width:860px){.panel{border-radius:18px 18px 0 0;border:0;box-shadow:none}}
/* Mòbil: títol i logo a dalt, botons a sota (abans el títol quedava aixafat) */
@media (max-width:620px){
  .head:has(.hlogo){display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px}
  .head:has(.hlogo) > div:first-child{grid-column:1;grid-row:1}
  .head:has(.hlogo) > .hlogo{grid-column:2;grid-row:1}
  .head:has(.hlogo) > .actions{grid-column:1/-1;grid-row:2}
  #view[data-g] > .head .label{border-radius:10px}
}
/* Interruptor d'aparença (automàtic, clar, fosc) */
.themesw{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;padding:3px;border-radius:var(--r-md);background:var(--side-2);margin-top:6px}
.themesw button{display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:none;color:var(--side-muted);font:500 12.5px var(--font);padding:7px 4px;border-radius:8px;cursor:pointer;transition:background var(--t-fast),color var(--t-fast),transform .12s var(--ease)}
.themesw button:hover{color:var(--side-fg)}
.themesw button[aria-pressed="true"]{background:var(--side-3);color:var(--side-fg);box-shadow:var(--sh-xs)}
.themesw button:active{transform:scale(.96)}
.themesw svg{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.list-pad .themesw{max-width:440px;background:#ececef;border-radius:var(--r-lg)}
.list-pad .themesw button{font-size:14px;padding:10px 8px;color:var(--muted)}
.list-pad .themesw button:hover{color:var(--ink)}
.list-pad .themesw button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:var(--sh-sm)}
.list-pad .themesw svg{width:16px;height:16px}
@media (max-width:860px){.side.open .side-foot{display:grid;margin-top:12px}}

    --tn-a:#7aa2e3; --tn-pn:#5fbf8a; --tn-pas:#d6a05a; --tn-in:#5fbf8a; --tn-out:#e07a6e; --tn-res:#9d93e0; --tn-ra4:#6b9bff; --tn-ra5:#b48ae8;
    --tn-a-s:color-mix(in srgb,var(--tn-a) 8%,#18181b); --tn-a-m:color-mix(in srgb,var(--tn-a) 16%,#18181b);
    --tn-pn-s:color-mix(in srgb,var(--tn-pn) 8%,#18181b); --tn-pn-m:color-mix(in srgb,var(--tn-pn) 16%,#18181b);
    --tn-pas-s:color-mix(in srgb,var(--tn-pas) 8%,#18181b); --tn-pas-m:color-mix(in srgb,var(--tn-pas) 16%,#18181b);

    --ws-edit:#f87171; --ws-edit-s:rgba(248,113,113,.12); --ws-sent:#60a5fa; --ws-sent-s:rgba(96,165,250,.12);
    --ws-ok:#4ade80; --ws-ok-s:rgba(74,222,128,.11); --ws-warn:#fbbf24; --ws-warn-s:rgba(251,191,36,.11); --ws-none:#52525b;
  }

const PROTO_MAX = 4;
// Cada arxiu es desa en una fitxa de Firebase (màxim 1 MB); en base64 ocupa un terç més
const PROTO_DOC_MAX = 700 * 1024, FILE_DATA_MAX = 950000;

function protoFilesHtml(fs, edit) {
  fs = fs || []; if (!fs.length) return edit ? '' : '';
  const imgs = fs.map((f, i) => [f, i]).filter(([f]) => f.kind === 'img'), docs = fs.map((f, i) => [f, i]).filter(([f]) => f.kind !== 'img');
  return `${imgs.length ? `<div class="pgal">${imgs.map(([f, i]) => `<figure class="pimg"><img src="${imgSrc(f.data)}" alt="${esc(f.name)}"><figcaption><span>${esc(f.name)}</span>${edit ? `<button type="button" class="btn ghost small" data-pdel="${i}">Treure</button>` : ''}</figcaption></figure>`).join('')}</div>` : ''}
    ${docs.length ? `<div class="pdocs">${docs.map(([f, i]) => `<div class="pdoc"><span class="pext">${esc((f.name.split('.').pop() || '').toUpperCase())}</span><div style="min-width:0"><b>${esc(f.name)}</b><div class="small muted">${fmtSize(f.size || 0)}</div></div>${edit ? `<button type="button" class="btn ghost small keep" data-pget="${i}">Descarregar</button><button type="button" class="btn ghost small" data-pdel="${i}">Treure</button>` : ''}</div>`).join('')}</div>` : ''}`;
}
function dataUrlBlob(u) { const [h, b] = u.split(','); const bin = atob(b); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: (h.match(/data:([^;]+)/) || [])[1] || 'application/octet-stream' }); }
function bindProtoFiles() {
  const inp = $('#protoIn'); if (!inp) return;
  const d = T().data.prototip; if (!Array.isArray(d.fitxers)) d.fitxers = [];
  const msg = m => { const el = $('#protoMsg'); if (el) el.textContent = m; };
  const rer = () => { const y = window.scrollY; render(); window.scrollTo(0, y); };
  const readImg = f => readImgFile(f, 1200);
  const readDoc = f => new Promise((ok, ko) => { const r = new FileReader(); r.onerror = ko; r.onload = () => ok({ kind: 'doc', name: f.name, size: f.size, data: r.result }); r.readAsDataURL(f); });
  inp.onchange = async e => {
    if (access('prototip') !== 'open') return;
    const files = [...e.target.files]; let skipped = [];
    for (const f of files) {
      if (d.fitxers.length >= PROTO_MAX) { skipped.push(`${f.name} (ja n'hi ha ${PROTO_MAX})`); continue; }
      const ext = (f.name.split('.').pop() || '').toLowerCase(), isImg = /^image\//.test(f.type);
      if (!isImg && !['pdf', 'docx', 'pptx'].includes(ext)) { skipped.push(`${f.name} (format no admès)`); continue; }
      if (!isImg && f.size > PROTO_DOC_MAX) { skipped.push(`${f.name} (fa ${fmtSize(f.size)} i el màxim és 700 kB: deseu-lo com a PDF més lleuger o pugeu-ne captures)`); continue; }
      try { const item = await (isImg ? readImg(f) : readDoc(f)); d.fitxers.push(item); T().updated = Date.now();
        if (!save()) { d.fitxers.pop(); save(); skipped.push(`${f.name} (no hi ha prou espai al navegador)`); } }
      catch (err) { skipped.push(`${f.name} (${err && err.message === 'big' ? 'la imatge és massa pesada' : 'no s\'ha pogut llegir'})`); }
    }

    if (get) { const f = d.fitxers[Number(get.dataset.pget)]; const dl = await getDownloads(); if (!dl) { get.textContent = 'No disponible aquí'; return; }

  });

// Llegeix una imatge, la redueix i la desa en JPG perquè càpiga en una fitxa de Firebase
function readImgFile(f, maxSide) {

}

function tresoTable(t) {

  const bal = (l, vals, cls) => `<tr class="t-res ${cls}"><td>${l}</td>${vals.map(x => `<td class="n ${x < 0 ? 'negc' : ''}">${N(x)}</td>`).join('')}<td></td></tr>`;

    <tr class="t-in sec"><td colspan="14">Cobraments</td></tr>${R.rows.filter(r => r.type === 'in').map(r => row(esc(r.label) + tag(r), r.vals, 'in')).join('')}${row('Total cobraments', R.inT, 'in', 'tot')}
    <tr class="t-out sec"><td colspan="14">Pagaments</td></tr>${R.rows.filter(r => r.type === 'out').map(r => row(esc(r.label) + tag(r), r.vals, 'out')).join('')}${row('Total pagaments', R.outT, 'out', 'tot')}
    ${bal('Saldo final', R.fin, 'tot')}</tbody></table></div>
    ${R.negative.length ? `<div class="notice">Compte: la tresoreria és negativa el mes ${R.negative.join(', ')}. Necessiteu més finançament o ajustar cobraments i pagaments.</div>` : R.sales.some(Boolean) ? '<div class="notice info">La tresoreria és positiva tots els mesos.</div>' : ''}`;
}

    ${card('Punt mort', pad(`${kv('Vendes necessàries a l\'any', isFinite(V.breakEven) ? N(V.breakEven) + ' €' : '—')}${kv('Vendes necessàries al mes', isFinite(V.breakEven) ? N(V.breakEven / 12) + ' €' : '—')}${kv('Vendes previstes a l\'any', N(V.revenue) + ' €')}

      ${!V.revenue ? '<div class="notice">Primer completeu les vendes al pla de tresoreria.</div>' : V.revenue >= V.breakEven ? `<div class="notice info"><b>Amb aquestes previsions, el projecte és rendible</b>: les vendes superen el punt mort en ${N(V.revenue - V.breakEven)} €.</div>` : `<div class="notice"><b>Amb aquestes previsions, el primer any hi hauria pèrdues.</b> Us falten ${N(V.breakEven - V.revenue)} € de vendes per arribar al punt mort.</div>`}

}

    ${card('Vista prèvia', `<div class="brandprev" id="brandPrev"></div>`)}</div>`
    + card('Per què aquest logo?', pad(`<div class="help">Expliqueu per què heu triat aquesta versió i no les altres dels esbossos.</div>`

    + card('Cultura empresarial', pad(ta('marca.missio', 'Missió', 'Per què existeix l\'empresa? Què fa i per a qui?', 2) + ta('marca.visio', 'Visió', 'Què vol arribar a ser l\'empresa d\'aquí a uns anys?', 2) + ta('marca.valors', 'Valors', 'Els principis que guien el comportament de l\'empresa.', 2))));
  const prev = () => { const m = T().data.marca, el = $('#brandPrev'); if (!el) return;

    if (!/^image\//.test(f.type)) return bad();
    const r = new FileReader(); r.onerror = bad; r.onload = () => { const img = new Image(); img.onerror = bad; img.onload = () => { const s = Math.min(1, 320 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); d.logo = c.toDataURL('image/png'); save(); render(); }; img.src = r.result; }; r.readAsDataURL(f); };

async function createGroupDoc() {

const courseLabel = exp => { const y = new Date(exp).getFullYear(); return (y - 1) + '-' + String(y).slice(2); };
async function deleteGroupDeep(gid) {
  const base = 'groups/' + gid, ops = [];
  const teams = await FB.list(base + '/teams').catch(() => []);
  for (const t of teams) {
    const files = await FB.list(base + '/teams/' + t.id + '/files').catch(() => []);
    files.forEach(f => ops.push({ op: 'del', path: base + '/teams/' + t.id + '/files/' + f.id }));
    ['review', 'grades', 'ai'].forEach(p => ops.push({ op: 'del', path: base + '/teams/' + t.id + '/prof/' + p }));
    ops.push({ op: 'del', path: base + '/teams/' + t.id });
  }
  const mem = await FB.list(base + '/members').catch(() => []);
  mem.forEach(m => ops.push({ op: 'del', path: base + '/members/' + m.id }));
  const inv = await FB.list(base + '/invites').catch(() => []);
