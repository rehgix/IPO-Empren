<!DOCTYPE html><html lang="ca"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Crect width=%2224%22 height=%2224%22 rx=%226%22 fill=%22%232bc46f%22/%3E%3Cpath d=%22M5 17l4.5-5.5 3.5 2.5 6-7.5%22 fill=%22none%22 stroke=%22%23111%22 stroke-width=%222.4%22 stroke-linecap=%22round%22/%3E%3C/svg%3E">
<script src="config.js"></script><script src="fbapi.js"></script>
<title>IPO Emprèn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
<style>
/* Disseny: menú lateral fosc + gran plafó blanc arrodonit; xifres grans, botons negres, llistes amb fileres i fletxes.
   Estètica única (clara) per decisió: no canvia amb el tema del sistema. */
:root{
  --side:#1c1c1e; --side-2:#2a2a2d; --side-fg:#f4f4f5; --side-muted:#8d8d93;
  --bg:#ffffff; --soft:#f7f7f8; --ink:#111113; --muted:#76767d; --line:#ebebee;
  --accent:#2bc46f; --accent-ink:#13804a; --accent-soft:#e7f8ee;
  --blue:#2d5bea; --blue-soft:#ebf0ff;
  --warn:#a85f00; --warn-soft:#fff3df; --bad:#d23a30; --bad-soft:#fdecea;
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --c1:#22b06b; --c2:#2d5bea; --c3:#f08c1a; --c4:#e0457b; --c5:#8455e8; --c6:#1aa3b8;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--side);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--side)}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
/* Menú lateral */
.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;display:flex;flex-direction:column;gap:8px;color:var(--side-fg);padding-block:22px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:22px;letter-spacing:-.02em;padding:0 10px 18px;border-bottom:1px solid var(--side-2)}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.logo svg{width:20px;height:20px}
.side-label{font-size:13px;color:var(--side-muted);padding:16px 12px 4px}
.role select{width:100%;background:var(--side-2);color:var(--side-fg);border:0;border-radius:10px;padding:10px 12px;font:500 14px var(--font)}
.role select option{background:#ffffff;color:#111113}
.nav{display:grid;gap:2px}
.nav button{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-radius:12px;padding:12px;color:var(--side-fg);font:500 16px var(--font);text-align:left;cursor:pointer;opacity:.85}
.nav button:hover{background:var(--side-2);opacity:1}
.nav button[aria-selected="true"]{background:var(--side-2);opacity:1;font-weight:600}
.nav svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;padding:14px 12px 0;border-top:1px solid var(--side-2);display:grid;gap:8px;font-size:13px;color:var(--side-muted)}
.side-foot b{color:var(--side-fg);font-weight:500;font-size:14px}
.quarter{display:flex;gap:4px}
.quarter .q{flex:1;height:6px;border-radius:3px;background:var(--side-2)}
.quarter .q.done{background:var(--accent)}
.quarter .q.now{background:var(--side-fg)}
/* Plafó blanc */
.panel{background:var(--bg);margin:12px 12px 12px 0;border-radius:22px;min-width:0}
.content{max-width:1120px;margin:0 auto;padding-block:48px 72px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));display:grid;gap:28px}
@media (min-width:1100px){.content{padding-left:56px;padding-right:56px}}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;padding-block:14px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .brand{border:0;padding-bottom:6px}
  .side-label,.side-foot{display:none}
  .nav{display:flex;overflow-x:auto;gap:4px}
  .nav button{width:auto;white-space:nowrap;padding:9px 12px;font-size:14px}
  .panel{margin:0;border-radius:22px 22px 0 0}
  .content{padding-block:28px 56px}
}
/* Capçalera de cada pàgina */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:20px}
.head .label{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:17px}
.head .big{font-size:clamp(34px,5vw,52px);font-weight:600;letter-spacing:-.035em;line-height:1.1;font-variant-numeric:tabular-nums}
.head .actions{display:flex;flex-wrap:wrap;gap:8px}
h1,h2,h3{letter-spacing:-.02em;text-wrap:balance;margin:0;font-weight:600}
h1{font-size:30px} h2{font-size:19px} h3{font-size:16px}
/* Targetes */
.sheet{background:var(--bg);border:1px solid var(--line);border-radius:20px;padding:24px;min-width:0}
.sheet > * + *{margin-top:14px}
.list{background:var(--soft);border:1px solid var(--line);border-radius:22px;padding:0 6px 6px;min-width:0}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 22px 14px;font-weight:600}
.list-head .muted{font-weight:400;font-size:14px}
.list-body{background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.list-body > * + *{border-top:1px solid var(--line)}
.list-pad{padding:22px}
.list-pad > * + *{margin-top:14px}
.lrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.4fr) auto 20px;align-items:center;gap:16px;padding:22px 28px;width:100%;background:none;border:0;font:inherit;color:inherit;text-align:left;cursor:pointer}
.lrow:hover{background:var(--soft)}
.lrow .t{font-size:17px;font-weight:500}
.lrow .s{color:var(--muted);font-size:14px}
.lrow .val{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.lrow .mid{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.chev{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2}
@media (max-width:640px){.lrow{grid-template-columns:minmax(0,1fr) auto 18px;padding:18px}.lrow .mid{grid-column:1/-1;grid-row:2}}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font-size:14px;color:var(--muted)}
.num,td.n,th.n{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.neg{color:var(--bad)} .pos{color:var(--accent-ink)}
.tablebox{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:10px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:500;color:var(--muted);font-size:13px}
tr:last-child td{border-bottom:0}
tr.total td{font-weight:600;border-top:1px solid var(--ink);border-bottom:0}
tr.sub td{font-weight:600}
td.ind{padding-left:18px;color:#3d3d43}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;padding:3px 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.grey{background:var(--soft);color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:10px;font:500 16px var(--font);border-radius:14px;padding:14px 24px;border:1px solid var(--ink);background:var(--ink);color:var(--bg);cursor:pointer}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{background:#2c2c30}
.btn.ghost{background:var(--bg);color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--soft)}
.btn.small{padding:9px 14px;font-size:14px;border-radius:11px}
.btn:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.notice{background:var(--warn-soft);color:#5c3600;padding:14px 18px;border-radius:14px;font-size:15px}
.notice.info{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
/* Decisions */
.dec-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
@media (max-width:1000px){.dec-layout{grid-template-columns:1fr}}
.field{display:grid;grid-template-columns:minmax(0,1fr) 140px;gap:4px 18px;align-items:center;padding:18px 22px}
.field label{font-weight:500;font-size:16px}
.field .help{grid-column:1;font-size:14px;color:var(--muted)}
.field input{grid-row:1/span 2;grid-column:2;width:100%;font:500 16px var(--font);font-variant-numeric:tabular-nums;text-align:right;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink)}
.field input:focus{background:var(--bg);border-color:var(--ink);outline:none}
@media (max-width:520px){.field{grid-template-columns:1fr}.field input{grid-row:auto;grid-column:1}}
.forecast{position:sticky;top:24px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-of-type{border-bottom:0}
.kv b{font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.bar{height:6px;background:var(--soft);border-radius:3px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent)}
.stat{display:grid;gap:2px;padding:18px 20px;background:var(--soft);border-radius:16px}
.stat .v{font-size:26px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chartbox{position:relative;height:270px}
input[type=text],input[type=number],select.field-sel,textarea{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);width:100%}
textarea{font-size:13px;min-height:140px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:14px}
.form-grid label{display:grid;gap:6px;font-size:14px;font-weight:500}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
.swatch{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#ffffff;font-weight:600;font-size:15px;flex:none}
.who{display:flex;align-items:center;gap:14px;min-width:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="#111113" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18l5-6 4 3 7-9"/><path d="M15 6h5v5"/></svg></span>IPO Emprèn</div>
    <div class="side-label"><label for="roleSel">Veure com</label></div>
    <div class="role"><select id="roleSel"></select></div>
    <div class="side-label" id="navLabel">Secció</div>
    <nav class="nav" id="tabs" role="tablist" aria-label="Seccions"></nav>
    <div class="side-foot"><b id="gameName"></b><span id="quarterTxt"></span><div class="quarter" id="quarterBar" aria-hidden="true"></div></div>
  </aside>
  <div class="panel"><main class="content" id="view"></main></div>
</div>

<style>
.field{grid-template-columns:minmax(0,1fr) minmax(140px,250px)}
.field select{grid-row:1/span 2;grid-column:2;width:100%}
.field input[type=text]{text-align:left}
@media (max-width:520px){.field select{grid-row:auto;grid-column:1}}
.choices{display:grid;gap:10px}
.choice{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:14px;cursor:pointer;background:var(--bg)}
.choice:has(input:checked){border-color:var(--ink);background:var(--soft)}
.choice input{margin-top:4px;accent-color:var(--ink);flex:none}
.choice > span{display:grid;gap:2px;min-width:0}
.offer,.offer-head{display:grid;grid-template-columns:minmax(0,2fr) 70px 80px 100px 150px;gap:12px;align-items:center;padding:14px 22px}
.offer-head{padding-block:10px;background:var(--soft)}
.offer .t{font-weight:500;font-size:16px}
.offer .s{color:var(--muted);font-size:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.offer input{text-align:right}
.offer input::placeholder{font-size:13px;color:var(--muted)}
@media (max-width:760px){
  .offer-head{display:none}
  .offer{grid-template-columns:repeat(3,minmax(0,1fr));padding:16px 18px}
  .offer > div:first-child,.offer > div:last-child{grid-column:1/-1}
  .offer .num{text-align:left}
  .offer .num::before{content:attr(data-l);display:block;font-size:12px;color:var(--muted)}
}
ul.fb{margin:0;padding-left:18px;display:grid;gap:10px}
ul.fb.good li::marker{color:var(--accent)} ul.fb.bad li::marker{color:var(--bad)} ul.fb.tip li::marker{color:var(--blue)}
.guide{max-width:780px}
.guide > * + *{margin-top:12px}
.guide h2{margin-top:24px}
</style>
<style>
/* Menú per departaments */
#navLabel{display:none}
.nav{display:grid;gap:12px;margin-top:6px}
.ngroup{display:grid;gap:1px}
.ghead{display:flex;align-items:center;gap:10px;padding:6px 12px;color:var(--side-fg);font:600 13px var(--font);letter-spacing:.09em;text-transform:uppercase}
.ghead svg{width:18px;height:18px;flex:none;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button{gap:12px;padding:7px 12px 7px 40px;font:400 14.5px var(--font);border-radius:10px;opacity:.78}
.nav button[aria-selected="true"]{opacity:1;background:var(--side-2);font-weight:500}
.nav .bullet{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:none;opacity:.8}
.nav button[aria-selected="true"] .bullet{opacity:1;box-shadow:0 0 0 3px rgba(43,196,111,.25)}
.menu-toggle{display:none}
.side-status{display:flex;align-items:center;gap:8px;color:var(--side-fg);font-size:13px}
.dotst{width:8px;height:8px;border-radius:50%;background:#e0a23a}
.dotst.ok{background:var(--accent)}
.side-btn{width:100%;justify-content:center;padding:11px 14px;font-size:14px;background:var(--side-fg);color:var(--side);border-color:var(--side-fg);margin-top:8px}
.side-btn:hover{background:#ffffff}
#sideAction:empty{display:none}
@media (max-width:860px){
  .menu-toggle{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--side-2);color:var(--side-fg);border:0;border-radius:12px;padding:12px 14px;font:500 15px var(--font);cursor:pointer}
  .nav{display:none;overflow:visible}
  .side.open .nav{display:grid}
  .nav button{width:100%;white-space:normal;padding:9px 12px 9px 40px;font-size:15px}
}
/* Pàgines */
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 22px}
.prow .t{font-weight:500}.prow .s{color:var(--muted);font-size:14px}
.choice.dim{opacity:.6}
.choice > span .small .pill{margin-right:6px}
</style>
<style>
.intro{max-width:72ch;margin:0}
.pfield{display:grid;gap:6px;padding:4px 0}
.pfield label{font-weight:500;font-size:16px}
.pfield .help,.field .help{font-size:14px;color:var(--muted)}
.pfield textarea,.member input,.interview input,.interview textarea,.pfield input[type=text]{width:100%;font:15px/1.5 var(--font);padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--soft);color:var(--ink);resize:vertical;min-height:44px}
.pfield textarea:focus,.member input:focus,.interview input:focus,.interview textarea:focus{background:var(--bg);border-color:var(--ink);outline:none}
.member{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center;margin-bottom:10px}
@media (max-width:620px){.member{grid-template-columns:1fr}}
.interview{display:grid;gap:8px;padding:14px;border:1px solid var(--line);border-radius:14px;margin-bottom:12px}
.canvas{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line)}
.canvas .cbox{background:var(--bg);padding:16px}
.canvas .cbox:nth-child(7),.canvas .cbox:nth-child(8){grid-column:span 2}
@media (max-width:900px){.canvas{grid-template-columns:repeat(2,minmax(0,1fr))}.canvas .cbox:nth-child(7),.canvas .cbox:nth-child(8){grid-column:span 1}}
@media (max-width:560px){.canvas{grid-template-columns:1fr}}
.dafo{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:700px){.dafo{grid-template-columns:1fr}}
.dafo-f .list-head span:first-child{color:var(--accent-ink)}.dafo-d .list-head span:first-child{color:var(--warn)}.dafo-o .list-head span:first-child{color:var(--blue)}.dafo-a .list-head span:first-child{color:var(--bad)}
.dafo .pfield label{display:none}
.ods{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px}
.odsi{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-size:14px}
.odsi:has(input:checked){border-color:var(--ink);background:var(--soft)}
.odsi b{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:6px;background:var(--ink);color:var(--bg);font-size:12px;margin-right:4px}
.odsi input{accent-color:var(--ink);margin-top:4px}
.tramits{margin:0;padding-left:22px;display:grid;gap:10px}
.tramits label{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.tramits label > span{display:grid;gap:2px}
.tramits input{accent-color:var(--ink);margin-top:5px}
.stepnav{justify-content:space-between}
.sumrow{display:grid;gap:2px;padding:8px 0;border-bottom:1px solid var(--line)}
.sumrow:last-child{border-bottom:0}
.acta{padding:12px 0;border-bottom:1px solid var(--line)}
.acta:last-child{border-bottom:0}
.acta p{margin:6px 0 0}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;cursor:pointer}
.pmbars{display:grid;gap:8px;margin:10px 0}
.pmbars > div{display:grid;grid-template-columns:80px 1fr;gap:10px;align-items:center;font-size:13px;color:var(--muted)}
.nav .bullet.st-done{background:var(--accent);opacity:1}
.nav .bullet.st-part{background:transparent;border:2px solid var(--accent);width:8px;height:8px}
.nav .bullet.st-none{background:transparent;border:2px solid var(--side-muted);width:8px;height:8px;opacity:.7}
.rubric table{min-width:900px}
.rubric td{vertical-align:top;width:17%}
.rubric td:first-child{width:15%}
.rcell{display:grid;gap:6px;padding:10px;border:1px solid var(--line);border-radius:12px;cursor:pointer;font-size:13px;line-height:1.4;height:100%;position:relative}
.rcell input{position:absolute;opacity:0;pointer-events:none}
.rcell:hover{background:var(--soft)}
.rcell.sel{border-color:var(--ink);background:var(--soft);box-shadow:inset 0 0 0 1px var(--ink)}
.rcell:focus-within{outline:2px solid var(--blue);outline-offset:2px}
.sug{font-style:normal;font-size:11px;font-weight:600;color:var(--accent-ink);display:flex;align-items:center;gap:5px}
.sug::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent)}
</style>
<style>
.intro{max-width:76ch;margin:0;line-height:1.6}
.nav button .nl{flex:1;min-width:0}
.nbadge{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#e0a23a;color:#111113;font-size:11px;font-weight:700;flex:none}

    const invT = (d.inversio.items || []).reduce((a, x) => a + num(x.import), 0);

    });

    const inT = months.map((_, k) => rows.filter(r => r.type === 'in').reduce((a, r) => a + r.vals[k], 0));

  }

const PROTO_MAX = 4;
const fmtSize = b => b > 1048576 ? (b / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(b / 1024)) + ' kB';
function protoFilesHtml(fs, edit) {
  fs = fs || []; if (!fs.length) return edit ? '' : '';
  const imgs = fs.map((f, i) => [f, i]).filter(([f]) => f.kind === 'img'), docs = fs.map((f, i) => [f, i]).filter(([f]) => f.kind !== 'img');
  return `${imgs.length ? `<div class="pgal">${imgs.map(([f, i]) => `<figure class="pimg"><img src="${f.data}" alt="${esc(f.name)}"><figcaption><span>${esc(f.name)}</span>${edit ? `<button type="button" class="btn ghost small" data-pdel="${i}">Treure</button>` : ''}</figcaption></figure>`).join('')}</div>` : ''}
    ${docs.length ? `<div class="pdocs">${docs.map(([f, i]) => `<div class="pdoc"><span class="pext">${esc((f.name.split('.').pop() || '').toUpperCase())}</span><div style="min-width:0"><b>${esc(f.name)}</b><div class="small muted">${fmtSize(f.size || 0)}</div></div>${edit ? `<button type="button" class="btn ghost small keep" data-pget="${i}">Descarregar</button><button type="button" class="btn ghost small" data-pdel="${i}">Treure</button>` : ''}</div>`).join('')}</div>` : ''}`;
}
function dataUrlBlob(u) { const [h, b] = u.split(','); const bin = atob(b); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: (h.match(/data:([^;]+)/) || [])[1] || 'application/octet-stream' }); }
function bindProtoFiles() {
  const inp = $('#protoIn'); if (!inp) return;
  const d = T().data.prototip; if (!Array.isArray(d.fitxers)) d.fitxers = [];
  const msg = m => { const el = $('#protoMsg'); if (el) el.textContent = m; };
  const rer = () => { const y = window.scrollY; render(); window.scrollTo(0, y); };
  const readImg = f => new Promise((ok, ko) => { const r = new FileReader(); r.onerror = ko; r.onload = () => { const img = new Image(); img.onerror = ko; img.onload = () => { const s = Math.min(1, 1200 / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); const x = c.getContext('2d'); x.fillStyle = '#ffffff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height); const data = c.toDataURL('image/jpeg', 0.82); ok({ kind: 'img', name: f.name.replace(/\.[^.]+$/, '') + '.jpg', size: Math.round(data.length * 0.75), data }); }; img.src = r.result; }; r.readAsDataURL(f); });
  const readDoc = f => new Promise((ok, ko) => { const r = new FileReader(); r.onerror = ko; r.onload = () => ok({ kind: 'doc', name: f.name, size: f.size, data: r.result }); r.readAsDataURL(f); });
  inp.onchange = async e => {
    if (access('prototip') !== 'open') return;
    const files = [...e.target.files]; let skipped = [];
    for (const f of files) {
      if (d.fitxers.length >= PROTO_MAX) { skipped.push(`${f.name} (ja n'hi ha ${PROTO_MAX})`); continue; }
      const ext = (f.name.split('.').pop() || '').toLowerCase(), isImg = /^image\//.test(f.type);
      if (!isImg && !['pdf', 'docx', 'pptx'].includes(ext)) { skipped.push(`${f.name} (format no admès)`); continue; }
      if (!isImg && f.size > 2 * 1048576) { skipped.push(`${f.name} (més de 2 MB)`); continue; }
      try { const item = await (isImg ? readImg(f) : readDoc(f)); d.fitxers.push(item); T().updated = Date.now();
        if (!save()) { d.fitxers.pop(); save(); skipped.push(`${f.name} (no hi ha prou espai al navegador)`); } }
      catch (err) { skipped.push(`${f.name} (no s'ha pogut llegir)`); }
    }
    rer(); if (skipped.length) msg('No s\'ha afegit: ' + skipped.join('; ') + '.');
  };
  $('#protoFiles').addEventListener('click', async e => {
    const del = e.target.closest('[data-pdel]'), get = e.target.closest('[data-pget]');
    if (del && access('prototip') === 'open') { d.fitxers.splice(Number(del.dataset.pdel), 1); T().updated = Date.now(); save(); rer(); }
    if (get) { const f = d.fitxers[Number(get.dataset.pget)]; const dl = await getDownloads(); if (!dl) { get.textContent = 'No disponible aquí'; return; }
      try { await dl.save({ filename: f.name, data: dataUrlBlob(f.data) }); } catch (err) { get.textContent = err && err.code === 'declined' ? 'Cancel·lat' : 'No s\'ha pogut'; } }
  });
}

    ${card('Punt mort', pad(`${kv('Vendes necessàries a l\'any', isFinite(V.breakEven) ? N(V.breakEven) + ' €' : '—')}${kv('Vendes necessàries al mes', isFinite(V.breakEven) ? N(V.breakEven / 12) + ' €' : '—')}${kv('Vendes previstes a l\'any', N(V.revenue) + ' €')}

      ${!V.revenue ? '<div class="notice">Primer completeu les vendes al pla de tresoreria.</div>' : V.revenue >= V.breakEven ? `<div class="notice info"><b>Amb aquestes previsions, el projecte és rendible</b>: les vendes superen el punt mort en ${N(V.revenue - V.breakEven)} €.</div>` : `<div class="notice"><b>Amb aquestes previsions, el primer any hi hauria pèrdues.</b> Us falten ${N(V.breakEven - V.revenue)} € de vendes per arribar al punt mort.</div>`}

    ${card('RA4 · Identifica, defineix i valida idees d\'emprenedoria generadores de noves oportunitats', pad(tbl(CA4)))}

function vConfig(v) {

    ${CLOUD ? '' : `<div class="grid2">

      ${card('Recuperar una còpia', pad(`<textarea id="impTxt" rows="5" placeholder="Enganxa aquí el text de la còpia"></textarea><input type="file" id="impFile" accept=".json,.txt"><div id="impMsg"></div><button class="btn small" id="impBtn">Recuperar</button>`))}
    </div>`}`;
  bindActsConfig(v); bindCloudConfig(v);
  $('#gName').oninput = e => { G.name = e.target.value; save(); renderSide(); };
  $('#gSector').onchange = e => { G.sector = e.target.value; G.teams.forEach(t => { if (!t.data.idea.sector) t.data.idea.sector = G.sector; }); save(); };
  v.querySelectorAll('[data-tn]').forEach(i => i.oninput = () => { G.teams[+i.dataset.tn].name = i.value; save(); renderSide(); });
  v.querySelectorAll('[data-tdel]').forEach(b => b.onclick = () => { const i = +b.dataset.tdel; $('#delBox').innerHTML = `<div class="notice">Vols esborrar «${esc(G.teams[i].name)}» i tot el seu projecte? <button class="btn small" id="delYes">Esborrar</button> <button class="btn ghost small" id="delNo">Cancel·lar</button></div>`; $('#delYes').onclick = () => { G.teams.splice(i, 1); profTeam = 0; save(); render(); }; $('#delNo').onclick = () => { $('#delBox').innerHTML = ''; }; });
  $('#tAdd').onclick = () => { G.teams.push({ id: newId(), name: 'Equip ' + (G.teams.length + 1), members: [], data: emptyData(G.sector), review: {}, delivered: null, evals: { levels: {}, comment: '' }, grades: {}, ai: {} }); save(); render(); };
  if (!CLOUD) $('#ngCreate').onclick = () => { const names = $('#ngTeams').value.split('\n').map(x => x.trim()).filter(Boolean); if (!names.length) { $('#ngBox').innerHTML = '<div class="notice">Escriu com a mínim un equip.</div>'; return; }
    $('#ngBox').innerHTML = `<div class="notice">Segur? S'esborraran tots els projectes actuals. <button class="btn small" id="ngYes">Sí, crear el grup</button> <button class="btn ghost small" id="ngNo">Cancel·lar</button></div>`;
    $('#ngYes').onclick = () => { const acts = G.acts, profs = G.profs; G = newGroup($('#ngName').value.trim() || 'IPO II', names, G.sector); G.acts = acts; if (profs) G.profs = profs; ensureEval(); role = 'prof'; tab = null; save(); render(); }; $('#ngNo').onclick = () => { $('#ngBox').innerHTML = ''; }; };
  if ($('#ngExample')) $('#ngExample').onclick = () => { G = exampleGroup(); ensureEval(); role = 'prof'; tab = null; save(); render(); };
  if (!CLOUD) $('#expTxt').value = JSON.stringify(G);
  if (!CLOUD) $('#expCopy').onclick = async () => { const x = $('#expTxt'); try { await navigator.clipboard.writeText(x.value); $('#expCopy').textContent = 'Copiat'; } catch (e) { x.select(); $('#expCopy').textContent = 'Text seleccionat: prem Ctrl+C'; } };
  if (!CLOUD) $('#impFile').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $('#impTxt').value = r.result; }; r.readAsText(f); };
  if (!CLOUD) $('#impBtn').onclick = () => { try { const g = JSON.parse($('#impTxt').value); if (g.v !== 1 || !g.teams) throw 0; if (CLOUD) g.teams.forEach(t => { t.id = newId(); }); G = g; ensureIds(); ensureEval(); role = 'prof'; tab = null; save(); render(); } catch (e) { $('#impMsg').innerHTML = '<div class="notice">Aquest text no és una còpia vàlida. Comprova que l\'has copiat sencer.</div>'; } };
}
