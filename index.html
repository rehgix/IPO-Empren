<script>
// Aparença: 'auto' (segons el sistema), 'light' o 'dark'. Es desa en aquest navegador i s'aplica abans de pintar.
const THEME_MQ = matchMedia('(prefers-color-scheme: dark)');
function themePref() { try { return localStorage.getItem('ipoTema') || 'auto'; } catch (e) { return 'auto'; } }
function applyTheme() { const p = themePref(); document.documentElement.classList.toggle('dark', p === 'dark' || (p === 'auto' && THEME_MQ.matches));
  document.querySelectorAll('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.themeSet === p))); }
function setTheme(p) { try { localStorage.setItem('ipoTema', p); } catch (e) {} applyTheme(); }
THEME_MQ.addEventListener('change', applyTheme); applyTheme();
document.addEventListener('click', e => { const b = e.target.closest('[data-theme-set]'); if (b) setTheme(b.dataset.themeSet); });
</script>

.head:has(.hlogo) > div:first-child{flex:1;min-width:0}

.choices.two{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
input[type=color]{width:64px;height:40px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#dosTxt:not(.sr-only){width:100%;font:13px var(--font);padding:10px;border:1px solid var(--line);border-radius:12px}
.pfield input[type=text]{width:100%}
.field select{grid-row:1/span 2;grid-column:2;width:100%}
@media (max-width:520px){.field{grid-template-columns:minmax(0,1fr)}.field select{grid-row:auto;grid-column:1}}


.actcode{display:inline-block;color:var(--bg);padding:1px 7px;font-size:12px;font-weight:600;margin-right:4px}
.gradebar{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin-top:12px}
.lvls{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:0}
.lvl{position:relative;display:grid;gap:1px;justify-items:center;min-width:84px;padding:8px 10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:500 13px var(--font);cursor:pointer}
.lvl small{font-size:11px;color:var(--muted)}
.lvl.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.lvl.on small{color:var(--bg);opacity:.7}
.lvl .sug{position:absolute;top:4px;right:6px}
.lvl .sug::before{margin:0}
.lvl .aisug{position:absolute;top:-8px;left:6px;font:700 9px var(--font);font-style:normal;background:var(--blue);color:#ffffff;border-radius:6px;padding:1px 5px}
.notein{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.notein input{width:90px;font:600 18px var(--font);text-align:right;padding:8px 10px;border-radius:12px;color:var(--ink)}
[data-gcom]{width:100%;margin-top:10px;font:14px var(--font);padding:10px 12px;border-radius:12px;color:var(--ink)}
.aibox{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.aires{background:var(--blue-soft);border-radius:12px;padding:12px 14px}
.aibox .btn svg,.row .btn svg{width:16px;height:16px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.acttab{min-width:980px}
.rubsel{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-top:12px}
.rubsel .field-sel{width:auto;max-width:100%;flex:1 1 240px;min-width:0}
.rgrid{display:grid;gap:8px;margin-top:12px}
.rrow{display:grid;grid-template-columns:minmax(110px,1fr) repeat(5,minmax(0,1.2fr));gap:6px}
.rct{display:grid;align-content:start;gap:2px;font-size:13px;padding:6px 2px}
.rcell .rl{font-size:11px;font-weight:600;color:var(--muted)}
.rcell.sel .rl{color:var(--ink)}
.rcell .aisug{position:absolute;top:-8px;right:8px;font:700 9px var(--font);font-style:normal;background:var(--blue);color:#ffffff;border-radius:6px;padding:1px 5px}
.rubai{list-style:none;margin:0;padding:0;display:grid;gap:2px;font-size:13px}
.rubai li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:3px 0}
.rubass{display:grid;gap:8px}
.rubassr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center;font-size:14px}
#rubImpBox,.rubed{min-width:0}
.rubprev{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.rubtab{min-width:760px;font-size:13px}.rubtab td{vertical-align:top}
.rubed{border:1px solid var(--line);border-radius:14px;margin:10px 0;background:var(--bg)}
.rubed summary{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding:14px 16px;cursor:pointer}
.rubed-b{padding:0 16px 16px}
.rcrit{border-top:1px solid var(--line);padding:12px 0}
.rcrit-h{display:flex;gap:10px;align-items:flex-end}
.rcrit-h > input{flex:1;min-width:0;font:600 14px var(--font);padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink)}
.rcrit-h .notein input{width:70px;font-size:14px}
.rcrit-d{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:8px}
.rcrit-d label{display:grid;gap:3px}
.rcrit-d textarea{width:100%;font:13px var(--font);padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);resize:vertical}
@media (max-width:620px){.rrow{grid-template-columns:1fr}.rct{padding:6px 0 0}.rubassr{grid-template-columns:1fr;gap:4px}.rcrit-d{grid-template-columns:1fr}.rcrit-h{flex-wrap:wrap}.rcrit-h > input{flex-basis:100%}}
.acttab input,.acttab textarea{width:100%;font:13px var(--font);padding:7px 8px;border-radius:8px;color:var(--ink)}
.acttab td{vertical-align:top}
.reportview{background:var(--bg);border:1px solid var(--line);padding:28px;min-width:0}
.reportview .rhead{position:relative;padding-right:110px}
.reportview .rk{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.reportview .rhead h1{font-size:28px;margin:4px 0}
.reportview .rmeta{color:var(--muted);font-size:13px}
.reportview .rlogo{position:absolute;right:0;top:0;width:90px;height:90px;object-fit:contain}
.reportview .rgrades{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}
.reportview .rgrades div{flex:1;min-width:120px;border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.reportview .rgrades span{display:block;font-size:12px;color:var(--muted)}
.reportview .rgrades b{font-size:26px}
.reportview h2{margin:26px 0 10px}
.reportview h4{font-size:12px;margin:14px 0 4px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.reportview .rtab{width:100%;border-collapse:collapse;font-size:14px}
.reportview .rasum td{background:var(--soft);font-weight:600}
.reportview .ract{border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:14px 0}
.reportview .rah{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}
.reportview .rcode{display:inline-block;color:var(--bg);padding:1px 7px;font-size:12px;font-weight:600}
.reportview .rnote{text-align:right;font-size:26px;font-weight:700;line-height:1}
.reportview .rnote small{display:block;font-size:12px;font-weight:500;color:var(--muted);margin-top:4px}
.reportview .rcom{background:var(--soft);border-radius:10px;padding:10px 12px;margin:10px 0}
.reportview dl{margin:0}.reportview dt{font-size:12px;color:var(--muted);margin-top:8px}.reportview dd{margin:2px 0 0}
.reportview .rempty{color:var(--muted);font-style:italic}
@media (max-width:620px){.reportview{padding:18px}.reportview .rhead{padding-right:0}.reportview .rlogo{position:static;margin-top:10px}}


#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);color:var(--bg);padding:12px 18px;font-size:14px;opacity:0;pointer-events:none;z-index:50;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
.steps{margin:0 0 12px;padding-left:20px;display:grid;gap:4px;font-size:14px}
#mPrompt,#mResp{width:100%;font:13px var(--font);padding:10px 12px;border-radius:12px;color:var(--ink)}


/* Codi de colors per a les taules */
:root{
  --tn-ra4:#2d5bea; --tn-ra5:#7a4fb0;
}
.tablebox{border-radius:14px}
table.fin{border-collapse:separate;border-spacing:0;width:100%;font-size:14px;border:1px solid var(--line);overflow:hidden;background:var(--bg)}
table.fin th,table.fin td{padding:10px 12px;border-bottom:1px solid var(--line)}
table.fin thead th{font-weight:600;text-transform:uppercase;border-bottom:1px solid var(--line)}
table.fin tbody tr:last-child td{border-bottom:0}
table.fin.zebra tbody tr:nth-child(even) td{background:#fafafb}
table.fin td.n,table.fin th.n{font-variant-numeric:tabular-nums}
/* Files per tons: franja de color a l'esquerra i fons suau */
table.fin tr[class*="t-"] td:first-child{box-shadow:inset 4px 0 0 var(--tone)}
.t-a{--tone:var(--tn-a);--tone-s:var(--tn-a-s);--tone-m:var(--tn-a-m)}
.t-pn{--tone:var(--tn-pn);--tone-s:var(--tn-pn-s);--tone-m:var(--tn-pn-m)}
.t-pas{--tone:var(--tn-pas);--tone-s:var(--tn-pas-s);--tone-m:var(--tn-pas-m)}
.t-in{--tone:var(--tn-in);--tone-s:var(--tn-in-s);--tone-m:var(--tn-in-m)}
.t-out{--tone:var(--tn-out);--tone-s:var(--tn-out-s);--tone-m:var(--tn-out-m)}
.t-res{--tone:var(--tn-res);--tone-s:var(--tn-res-s);--tone-m:var(--tn-res-m)}
.t-ra4{--tone:var(--tn-ra4);--tone-s:#eef3ff;--tone-m:#dce6ff}
.t-ra5{--tone:var(--tn-ra5);--tone-s:#f4eeff;--tone-m:#e8dcfa}
table.fin tr[class*="t-"] td{background:var(--tone-s)}
table.fin tr.sec td{font-weight:700;text-transform:uppercase;padding:8px 12px;box-shadow:none!important}
table.fin tr.sub td{background:var(--tone-m);font-weight:600}
table.fin tr.tot td{background:var(--tone-m);font-weight:700;color:var(--ink)}
table.fin td.negc{background:#fde3e1!important;color:var(--bad);font-weight:600}
table.fin .zero{color:#c4c4ca}
.c-in{color:var(--tn-in)}.c-out{color:var(--tn-out)}.c-pas{color:var(--tn-pas)}
table.fin tr.tot td.c-in,table.fin tr.tot td.c-out{font-weight:700}
.tagauto{display:inline-block;font-size:10px;font-weight:600;background:rgba(17,17,19,.07);color:var(--muted);border-radius:6px;padding:1px 6px;vertical-align:1px;margin-left:4px}
/* Llegenda */
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.lg{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--muted)}
.lg::before{content:"";width:12px;height:12px;border-radius:4px;background:var(--c)}
.lg-a{--c:var(--tn-a)}.lg-pn{--c:var(--tn-pn)}.lg-pas{--c:var(--tn-pas)}.lg-in{--c:var(--tn-in)}.lg-out{--c:var(--tn-out)}.lg-res{--c:var(--tn-res)}
/* Balanç en dues columnes (compte en T) */
.tacc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
@media (max-width:820px){.tacc{grid-template-columns:1fr}}
/* Xips */
.chip{display:inline-block;margin:2px 0}
.chip-in{background:var(--tn-in-s);color:var(--tn-in)}.chip-out{background:var(--tn-out-s);color:var(--tn-out)}.chip-a{background:var(--tn-a-s);color:var(--tn-a)}
table.fin tr.selrow td{background:var(--tn-a-s)}
table.fin tr.selrow td:first-child{box-shadow:inset 4px 0 0 var(--tn-a)}
/* Matriu d'idees: mapa de calor */
table.matrix td.sc{transition:background .2s}
.sc-1{background:#fde3e1!important}.sc-2{background:#ffeedd!important}.sc-3{background:#fff7d6!important}.sc-4{background:#e7f6dc!important}.sc-5{background:#d3efdf!important}
table.matrix tr.best td{background:var(--tn-pn-s)}
table.matrix tr.best td:first-child{box-shadow:inset 4px 0 0 var(--tn-pn)}
.crown{display:inline-block;font-size:10px;font-weight:700;background:var(--tn-pn);color:#ffffff;border-radius:6px;padding:1px 6px;margin-right:4px}
.totb{display:inline-block;min-width:34px;text-align:center;color:var(--bg);padding:2px 8px}
/* Tresoreria: primera columna fixa */
table.fin.treso td:first-child,table.fin.treso th:first-child{position:sticky;left:0;z-index:1;min-width:220px}
table.fin.treso thead th:first-child{background:var(--soft)}
table.fin.treso tr[class*="t-"] td:first-child{background:var(--tone-s)}
table.fin.treso tr.sub td:first-child,table.fin.treso tr.tot td:first-child{background:var(--tone-m)}
/* PESTEL i DAFO amb tons */
.pestel > div:nth-child(3n+2):not(.ph){background:var(--tn-in-s)}
.pestel > div:nth-child(3n):not(.ph){background:var(--tn-out-s)}
.pestel .ph.pos{background:var(--tn-in);color:#ffffff}.pestel .ph.neg{background:var(--tn-out);color:#ffffff}
.dafo-f .list-head{background:var(--tn-pn-s)}.dafo-d .list-head{background:var(--warn-soft)}.dafo-o .list-head{background:var(--tn-a-s)}.dafo-a .list-head{background:var(--tn-out-s)}
/* Notes */
.gchip{display:inline-block;min-width:44px;text-align:center;padding:2px 8px}
.g-hi{background:#dcf5e7;color:#13804a}.g-ok{background:#e0f2f1;color:#0f766e}.g-mid{background:#fff1d6;color:#a85f00}.g-low{background:#fde3e1;color:#b3261e}.g-none{background:#f0f0f2;color:#6b6b72}
.reportview .rnote.g-hi,.reportview .rnote.g-ok,.reportview .rnote.g-mid,.reportview .rnote.g-low,.reportview .rnote.g-none,.reportview .rgrades b[class^="g-"]{background:none}
.reportview .rnote.g-hi,.reportview .rgrades b.g-hi{color:#13804a}.reportview .rnote.g-ok,.reportview .rgrades b.g-ok{color:#0f766e}.reportview .rnote.g-mid,.reportview .rgrades b.g-mid{color:#a85f00}.reportview .rnote.g-low,.reportview .rgrades b.g-low{color:#b3261e}
.reportview .rgrades .ra-ra4{border-top:4px solid var(--tn-ra4)}.reportview .rgrades .ra-ra5{border-top:4px solid var(--tn-ra5)}
.reportview .ract.ra-ra4{border-left:4px solid var(--tn-ra4)}.reportview .ract.ra-ra5{border-left:4px solid var(--tn-ra5)}
.reportview table.fin tr.rasec td{font-size:12px;font-weight:700;box-shadow:none}
.reportview table.fin tr.rasum td{background:var(--tone-m)!important;font-weight:700}
table.matrix thead input{min-width:130px}


/* DAFO: el color queda dins de la capsa */
.dafo .list-head{background:none!important}
.dafo-f .list{background:#eef7f1}.dafo-d .list{background:#fdf5e7}.dafo-o .list{background:#eef3fb}.dafo-a .list{background:#fbefee}
.dafo-f .list-head span:first-child,.dafo-d .list-head span:first-child,.dafo-o .list-head span:first-child,.dafo-a .list-head span:first-child{display:inline-flex;align-items:center;gap:8px}
.dafo .list-head span:first-child::before{content:"";width:10px;height:10px;border-radius:3px;background:currentColor}
/* Paleta més sobria per a les taules financeres */
:root{
  --tn-a:#3a5a8c; --tn-a-s:#f5f8fc; --tn-a-m:#e9eff7;
  --tn-pn:#3f7a5c; --tn-pn-s:#f4f9f6; --tn-pn-m:#e6f1eb;
  --tn-pas:#9a6a2f; --tn-pas-s:#fbf7f1; --tn-pas-m:#f4eadc;
  --tn-in:#3f7a5c; --tn-in-s:#f4f9f6; --tn-in-m:#e6f1eb;
  --tn-out:#a54a3f; --tn-out-s:#fcf5f4; --tn-out-m:#f6e6e3;
  --tn-res:#5a5390; --tn-res-s:#f6f5fb; --tn-res-m:#ebe9f5;
}
table.fin tr.sec td{background:var(--tone-m)!important;color:var(--tone);font-size:11.5px;letter-spacing:.07em}
table.fin tr.sec td:first-child{box-shadow:inset 4px 0 0 var(--tone)!important}
table.fin tr.tot td{border-top:1px solid var(--tone)}
table.fin th.h-a,table.fin th.h-p{background:var(--soft);color:var(--ink);font-size:12px;letter-spacing:.05em;border-bottom:2px solid var(--ink)}
.reportview table.fin tr.rasec td{background:var(--tone-m)!important;color:var(--tone)}
/* Apartats tancats */
.lockic{display:inline-grid;place-items:center;width:14px;flex:none}
.lockic svg{width:13px;height:13px;stroke:var(--side-muted)}
.rotag{font-size:10px;color:var(--side-muted);border:1px solid var(--side-2);border-radius:6px;padding:0 5px;flex:none}
.locked-box{display:flex;gap:16px;align-items:flex-start;padding:28px}
.locked-box svg{width:28px;height:28px;flex:none;stroke:var(--muted);fill:none;stroke-width:1.7}
.locked-box p{margin:6px 0 0}
.accrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:14px 22px}
.accrow .t{font-weight:500}.accrow .s{color:var(--muted);font-size:13px}
@media (max-width:760px){.accrow{grid-template-columns:1fr}}
.seg{display:inline-flex;border:1px solid var(--line);overflow:hidden}
.seg button{border:0;background:var(--bg);padding:8px 12px;font:500 13px var(--font);color:var(--muted);cursor:pointer}
.seg button + button{border-left:1px solid var(--line)}
.seg button.on.s-open{background:var(--accent-soft);color:var(--accent-ink)}
.seg button.on.s-closed{background:var(--ink);color:var(--bg)}
.seg button.on.s-readonly{background:var(--warn-soft);color:var(--warn)}
.accdate{display:grid;gap:2px;font-size:12px;color:var(--muted)}
.accdate input{font:13px var(--font);padding:6px 8px;border-radius:10px;color:var(--ink)}
.accdate input:disabled{opacity:.4}


/* ===== Color per blocs del projecte ===== */
.nav .ncount{margin-left:auto;min-width:22px;padding:1px 7px;border-radius:99px;background:var(--accent);color:#1c1408;font-size:12px;font-weight:600;text-align:center}

/* Menú: cada bloc amb el seu color */
.ngroup[data-g] .ghead svg{stroke:var(--gl)}
.ngroup[data-g] .ghead{color:#fff}
.ngroup[data-g] .nav button .bullet,.ngroup[data-g] .bullet{background:var(--gl)}
.ngroup[data-g] .bullet.st-part{background:transparent;border-color:var(--gl)}
.ngroup[data-g] button[aria-selected="true"] .bullet{box-shadow:0 0 0 3px color-mix(in srgb,var(--gl) 30%,transparent)}

/* Capçalera de la pàgina: franja de color suau */
#view[data-g] > .head .label{width:fit-content;font-weight:600;border-radius:999px;margin-bottom:8px}

/* Introducció i targetes */

.rsum-i.sent{background:var(--ws-sent-s)}.rsum-i.sent b{color:var(--ws-sent)}

.nav .bullet.ws{opacity:1;border:0;width:8px;height:8px}.nav .bullet.ws-none{background:transparent!important;border:1.5px solid #6b7280!important;width:8px;height:8px}
/* Barra d'enviament de l'alumnat */
.sendbar{display:flex;align-items:center;gap:14px;padding:16px 18px;border:1.5px solid;margin-top:8px}
.sendbar .sb-t{flex:1;font-size:14.5px;line-height:1.5}
.sendbar .wsdot{flex:none;width:14px;height:14px;border-radius:50%}
.sendbar.ws-sent{background:var(--ws-sent-s);border-color:#bcd0f7;color:#1e3a8a}
.sendbar.ws-correcte{background:var(--ws-ok-s);border-color:#c4e6d1;color:#14532d}
.sendbar.ws-none{background:#f8fafc;border-color:#e2e8f0;color:#475569}
@media (max-width:640px){.sendbar{flex-wrap:wrap}.sendbar .btn{width:100%;justify-content:center}}
.accdates{display:flex;gap:10px;flex-wrap:wrap}

.wsbadge.rvb{background:#fff;border:1.5px solid currentColor}.wsbadge.rvb.correcte{color:#1d6b3e}
/* Qui ha escrit cada cosa */
.whochips{display:inline-flex;flex-wrap:wrap;gap:6px;vertical-align:middle}
.whochip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;line-height:1.2;padding:3px 10px;border-radius:999px;color:var(--wc);background:color-mix(in srgb,var(--wc) 12%,#fff);white-space:nowrap}
.whochip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--wc)}
.whochips.mini{display:flex;gap:4px;margin-top:4px}
.whochips.mini .whochip{font-size:11px;padding:1px 7px;gap:4px}
.whochips.mini .whochip::before{width:6px;height:6px}
.whot{background:color-mix(in srgb,var(--wc) 13%,transparent);box-shadow:inset 0 -2px 0 color-mix(in srgb,var(--wc) 70%,transparent);border-radius:3px}

/* ================= SISTEMA DE DISSENY v2 =================
   Capa final: grisos zinc, vores subtils, ombres en capes, radis generosos i microinteraccions.
   Va al final perquè mani sobre les regles anteriors; la lògica no canvia. */
:root{
  --accent:#f59e0b; --accent-ink:#b45309; --accent-soft:#fff6e6; --blue-soft:#eff4ff;
  --warn:#b45309; --warn-soft:#fff7e6; --bad:#dc2626; --bad-soft:#fef2f2;
  --sh-xs:0 1px 2px rgba(24,24,27,.05);
  --sh-sm:0 1px 2px rgba(24,24,27,.04),0 1px 3px rgba(24,24,27,.06);
  --sh-md:0 2px 4px rgba(24,24,27,.04),0 6px 16px -2px rgba(24,24,27,.08);
  --sh-lg:0 4px 8px rgba(24,24,27,.04),0 16px 36px -6px rgba(24,24,27,.14);
  --ring:0 0 0 3px rgba(37,99,235,.18);
  --ease:cubic-bezier(.2,.8,.2,1); --t-fast:.15s var(--ease); --t:.25s var(--ease);
}
body{font-size:15px;letter-spacing:-.003em;text-rendering:optimizeLegibility}
::selection{background:color-mix(in srgb,var(--blue) 18%,transparent)}
*{scrollbar-width:thin;scrollbar-color:#d4d4d8 transparent}
.side{scrollbar-color:var(--side-3) transparent}

/* Menú lateral */
.brand{font-size:19px;letter-spacing:-.025em}
.role select{background:var(--side-3);border:1px solid var(--side-border);transition:border-color var(--t-fast),background var(--t-fast);cursor:pointer}
.role select:hover{border-color:var(--side-muted)}
.ghead{font-size:11.5px}
.nav button{transition:background var(--t-fast),opacity var(--t-fast),color var(--t-fast),transform .1s var(--ease)}
.nav button:hover{opacity:1}
.nav button[aria-selected="true"]{opacity:1}
.nav button:active,.menu-toggle:active{transform:scale(.98)}
.side-foot{border-color:var(--side-2)}
.quarter .q{transition:background var(--t)}

/* Plafó principal */
.panel{background:var(--canvas);border:1px solid var(--line);box-shadow:var(--sh-md);border-radius:18px}

/* Capçalera de pàgina */
#view[data-g] > .head{position:relative;overflow:hidden}
#view[data-g] > .head::after{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--gc) 45%,transparent),transparent)}
#view[data-g] > .head .label{font-size:12.5px;padding:4px 11px;border-color:color-mix(in srgb,var(--gc) 20%,var(--line))}
#view[data-g] > .head .big{color:var(--ink)}
.tbanner{border-left-width:4px}

/* Targetes */
.sheet,.list,.reportview,.rcard,.gcard,.rtab,.pimg,.pdoc,.locked-box,.aipick{box-shadow:var(--sh-sm)}
.sheet{border-color:var(--line)}
.list{border-color:var(--line)}
.list-body{border-color:var(--line)}
.chev{stroke:var(--muted);transition:transform var(--t-fast),stroke var(--t-fast)}
.gcard,.rtab,.choice,.odsi,.rcell,.pdoc,.pimg,.interview{transition:transform var(--t),box-shadow var(--t),border-color var(--t),background var(--t)}
.gcard:hover,.rtab:hover,.pdoc:hover,.pimg:hover{box-shadow:var(--sh-md);border-color:var(--line-2)}
.gcard:hover{border-color:color-mix(in srgb,#e08a0b 50%,var(--line))}
.choice:hover,.odsi:hover{border-color:var(--line-2);box-shadow:var(--sh-sm)}
.choice:has(input:checked),.odsi:has(input:checked){border-color:var(--ink);background:var(--bg);box-shadow:0 0 0 1px var(--ink),var(--sh-sm)}
.gcard,.rtab,.rcard,.reportview{border-color:var(--line);border-radius:var(--r-2xl)}
.rtab.on{box-shadow:0 0 0 2px #e08a0b inset,var(--sh-md)}
.interview{border-color:var(--line);background:var(--bg)}
details.ex{transition:box-shadow var(--t)}
details.ex[open]{box-shadow:var(--sh-sm)}
details.ex summary{list-style-position:inside}

/* Indicadors (KPI) */
.stat{padding:18px 20px;gap:4px;position:relative;transition:transform var(--t),box-shadow var(--t)}
.stat:hover{box-shadow:var(--sh-md)}
.stat > .muted.small:first-child{font-weight:500}
.stat .v{font-size:30px;letter-spacing:-.035em;line-height:1.15}
.grid3 .stat:nth-child(1){--kc:#22b864}.grid3 .stat:nth-child(2){--kc:#4f5bd5}.grid3 .stat:nth-child(3){--kc:#e08a2b}.grid3 .stat:nth-child(4){--kc:#2563eb}
.grid2 .stat:nth-child(1){--kc:var(--tn-ra4)}.grid2 .stat:nth-child(2){--kc:var(--tn-ra5)}
.bar,.gbar{border-radius:99px;height:6px}
.bar span,.gbar span{border-radius:99px}
.rsum-i{transition:transform var(--t),box-shadow var(--t)}
.rsum-i:hover{box-shadow:var(--sh-md)}
.rsum-i b{font-size:30px;letter-spacing:-.035em;font-variant-numeric:tabular-nums}

/* Badges d'estat */
.pill,.wsbadge,.chip,.rfill{border-radius:999px;font-size:12.5px;font-weight:550;padding:2px 9px;box-shadow:inset 0 0 0 1px color-mix(in srgb,currentColor 18%,transparent)}
.pill::before{width:6px;height:6px}
.whochip{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--wc) 20%,transparent)}
.actcode,.reportview .rcode,.totb{border-radius:6px;background:var(--ink)}

/* Botons */
.btn{font-size:15px;padding:11px 18px;gap:8px;transition:transform .12s var(--ease),box-shadow var(--t-fast),background var(--t-fast),border-color var(--t-fast),opacity var(--t-fast)}
.btn.small{padding:7px 12px;font-size:13.5px}
.btn:active,.lvl:active,.rb:active,.seg button:active,.rfilters button:active,.rquick button:active,.upl:active,.dashbtn:active,.linkbtn:active,.joinlist .btn:active{transform:scale(.96)}
.btn:disabled,.btn:disabled:hover{transform:none;box-shadow:none}
.lvl,.rb,.seg button,.rfilters button,.rquick button,.upl,.dashbtn,.rnav-i{transition:background var(--t-fast),border-color var(--t-fast),color var(--t-fast),box-shadow var(--t-fast),transform .12s var(--ease)}
.lvl{box-shadow:var(--sh-xs)}
.lvl:hover{border-color:var(--line-2);background:#fafafa}
.rb{border-width:1px;box-shadow:var(--sh-xs)}
.seg{border-color:var(--line-2);box-shadow:var(--sh-xs)}
.rfilters{background:#ececef;padding:3px}
.rfilters button:hover:not(.on){color:var(--ink)}
.rfilters button.on{box-shadow:var(--sh-sm)}
.dashbtn{box-shadow:var(--sh-sm)}
.dashbtn:hover{box-shadow:var(--sh-md)}

/* Camps de formulari */
input[type=text],input[type=number],input[type=url],input[type=email],input[type=date],select.field-sel,textarea,.field input,.pfield textarea,.pfield input[type=text],.vlink input[type=url],.member input,.interview input,.interview textarea,.irow input,.trow input,.acttab input,.acttab textarea,.notein input,[data-gcom],.review textarea,.rrev textarea,.linkbox input,.accdate input,#mPrompt,#mResp,table.matrix input{background:var(--bg);border:1px solid var(--line-2);box-shadow:var(--sh-xs);transition:border-color var(--t-fast),box-shadow var(--t-fast)}
input[type=text]:hover,input[type=number]:hover,textarea:hover,select.field-sel:hover{border-color:#a1a1aa}
input:focus,textarea:focus,select:focus{outline:none}
#view[data-g] .pfield textarea:focus,#view[data-g] .pfield input[type=text]:focus{border-color:var(--gc)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--gc) 16%,transparent)!important}
input:disabled,textarea:disabled,select:disabled{background:var(--soft);box-shadow:none}
.field{padding:16px 20px}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}

/* Taules */
table.fin{border-color:var(--line);border-radius:var(--r-xl)}
table.fin thead th{background:#fafafa;color:var(--muted);font-size:11px;letter-spacing:.07em}
table.fin tbody td{transition:background var(--t-fast)}
table.fin tbody tr:hover td{filter:none;background:color-mix(in srgb,var(--tone-s,#fff) 70%,#f4f4f5)}
th,td{border-color:var(--line)}
tbody tr{transition:background var(--t-fast)}
.rcell{border-radius:var(--r-lg)}
.rcell:hover{border-color:var(--line-2);box-shadow:var(--sh-sm)}

/* Avisos i diversos */
.notice{border:1px solid color-mix(in srgb,var(--warn) 18%,transparent)}
.notice.info{background:var(--bg);border-color:var(--line)}
.sendbar{border-width:1px}
#toast{background:rgba(24,24,27,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:var(--r-lg);box-shadow:var(--sh-lg);transition:opacity .25s var(--ease),transform .25s var(--ease)}
#syncPill{background:rgba(255,255,255,.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:var(--sh-md);border-color:var(--line)}
.upl:hover{box-shadow:var(--sh-sm)}
.rcard{transition:box-shadow var(--t)}
.rcard:hover{box-shadow:var(--sh-md)}
.rrev{background:#fafafa}

/* Entrada de cada pàgina: fosa + petit desplaçament, esglaonat */
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
#view.vin > *{animation:vin .42s var(--ease) both}
#view.vin > :nth-child(2){animation-delay:.04s}#view.vin > :nth-child(3){animation-delay:.08s}#view.vin > :nth-child(4){animation-delay:.12s}
#view.vin > :nth-child(5){animation-delay:.16s}#view.vin > :nth-child(6){animation-delay:.2s}#view.vin > :nth-child(n+7){animation-delay:.24s}
#view.vin .bar span,#view.vin .gbar span{transform-origin:left;animation:grow .8s .15s var(--ease) both}
@media (max-width:860px){.panel{border-radius:18px 18px 0 0;border:0;box-shadow:none}}
/* Mòbil: títol i logo a dalt, botons a sota (abans el títol quedava aixafat) */
@media (max-width:620px){
  .head:has(.hlogo){display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:14px}
  .head:has(.hlogo) > div:first-child{grid-column:1;grid-row:1}
  .head:has(.hlogo) > .hlogo{grid-column:2;grid-row:1}
  .head:has(.hlogo) > .actions{grid-column:1/-1;grid-row:2}
  #view[data-g] > .head .label{border-radius:10px}
}
/* Interruptor d'aparença (automàtic, clar, fosc) */
.themesw{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;padding:3px;background:var(--side-2);margin-top:6px}
.themesw button{display:flex;align-items:center;justify-content:center;gap:6px;border:0;background:none;color:var(--side-muted);font:500 12.5px var(--font);padding:7px 4px;cursor:pointer;transition:background var(--t-fast),color var(--t-fast),transform .12s var(--ease)}
.themesw button:hover{color:var(--side-fg)}
.themesw button[aria-pressed="true"]{background:var(--side-3);color:var(--side-fg);box-shadow:var(--sh-xs)}
.themesw button:active{transform:scale(.96)}
.themesw svg{width:14px;height:14px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.list-pad .themesw{max-width:440px;background:#ececef;border-radius:var(--r-lg)}
.list-pad .themesw button{font-size:14px;padding:10px 8px;color:var(--muted)}
.list-pad .themesw button:hover{color:var(--ink)}
.list-pad .themesw button[aria-pressed="true"]{background:var(--bg);color:var(--ink);box-shadow:var(--sh-sm)}
.list-pad .themesw svg{width:16px;height:16px}
@media (max-width:860px){.side.open .side-foot{display:grid;margin-top:12px}}

/* ================= TEMA BLOCS =================
   Fons gris clar, targetes (blocs) amb radis grans, un sol color d'acció (indi), xips en forma de píndola.
   Va just abans del tema fosc perquè aquest el pugui adaptar. */
:root{
  --page:#F1F3F8; --tile:#ffffff; --hero:#0F1222; --hero-fg:#ffffff; --hero-mu:#B4BAD0;
  --side:#ffffff; --side-2:#EEF0F5; --side-3:#ffffff; --side-fg:#0F1222; --side-muted:#5C6378;
  --side-hover:rgba(15,18,34,.05); --side-ring:transparent; --side-border:#D3D7E2; --side-sel:#0F1222;
  --bg:#ffffff; --canvas:#F1F3F8; --soft:#F4F5F9; --ink:#0F1222; --ink-2:#3A4052; --muted:#5C6378;
  --line:#E3E6EE; --line-2:#D3D7E2; --dash:#C0C6D6; --bit:rgba(255,255,255,.74); --track:#E6E8F1;
  --pri:#F5A00F; --pri-h:#E08E06; --pri-fg:#1B1303; --blue:#2458E6;
  --r-md:12px; --r-lg:14px; --r-xl:20px; --r-2xl:28px;
  --sh-float:0 1px 2px rgba(15,18,34,.06),0 8px 22px -12px rgba(15,18,34,.25);
  --ws-edit:#D99A00; --ws-edit-s:#FFE9B8; --ws-sent:#2458E6; --ws-sent-s:#D6E3FF; --ws-ok:#169B4C; --ws-ok-s:#CDF0DA; --ws-warn:#D3372C; --ws-warn-s:#FFD4CF; --ws-none:#C0C6D6;
  --st-ok-b:#CDF0DA; --st-ok-f:#0F6234; --st-sent-b:#D6E3FF; --st-sent-f:#1A47C2; --st-edit-b:#FFE9B8; --st-edit-f:#7A4B00;
  --st-mil-b:#FFD4CF; --st-mil-f:#A8201A; --st-none-b:#E6E8EE; --st-none-f:#464C5E; --fb-b:#FFE7E3; --fb-f:#7A1710; --hot:#FFD23F; --hot-f:#3D3000;
}
/* Colors dels blocs: to fort (--gc), fons pastel (--gs) i to clar per al tema fosc (--gl) */
[data-g],[data-g="proj"]{--gc:#2B3350;--gs:#E3E7F1;--gl:#9AA5CC}
[data-g="ident"]{--gc:#D81E6C;--gs:#FFE0EC;--gl:#FF6FA8}
[data-g="idea"]{--gc:#C75300;--gs:#FFE8D4;--gl:#FF9A4D}
[data-g="entorn"]{--gc:#0B7F72;--gs:#D5F3EE;--gl:#3CCBB8}
[data-g="model"]{--gc:#5B3FE0;--gs:#E6E0FF;--gl:#9C88FF}
[data-g="marxa"]{--gc:#2458E6;--gs:#DAE6FF;--gl:#7AA2FF}
[data-g="viab"]{--gc:#167A3A;--gs:#D9F4E1;--gl:#4FD07F}
[data-g="mkt"]{--gc:#D3372C;--gs:#FFDFDB;--gl:#FF7A6E}
[data-g="lliura"],[data-g="rec"]{--gc:#464C5E;--gs:#E6E8EE;--gl:#A3A9BA}
[data-g="prof"]{--gc:#B86E00;--gs:#FFEFD0;--gl:#F5A00F}
[data-g="admin"]{--gc:#6D3FC0;--gs:#EEE6FB;--gl:#B08CF5}
body,body::before{background:var(--page)}
/* Menú lateral (calaix) */
.brand{border-color:var(--side-2)}
.logo{background:var(--ink);box-shadow:none;border-radius:11px}
.logo svg{stroke:var(--bg)}
.ghead{color:var(--side-fg)!important;font:650 14px var(--font);padding:8px 12px 4px}
.ghead svg{display:none}
.ghead::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--gc,var(--ink));flex:none}
.nav button{border-radius:999px;opacity:1;color:var(--ink-2);padding:8px 14px 8px 34px}
.nav button:hover{background:var(--side-hover)}
.nav button[aria-selected="true"],.ngroup[data-g] button[aria-selected="true"]{background:var(--side-sel);color:var(--bg);box-shadow:none!important;font-weight:600}
.nav button.locked{opacity:.5}
.role select{border-radius:999px;padding:10px 14px}
.themesw{border-radius:999px}.themesw button{border-radius:999px}
.quarter .q.done{background:var(--pri)}
.dashbtn{border-radius:999px;background:var(--pri);color:var(--pri-fg)}
.dashbtn:hover{background:var(--pri-h)}
.dashbtn.alt{background:var(--soft);color:var(--ink);border-color:var(--line)}
.dashbtn.alt:hover,.dashbtn.alt.on{background:var(--ink);color:var(--bg)}
.dashbtn .dcount{background:var(--pri);color:var(--pri-fg)}
/* Sense plafó blanc: les targetes van directament sobre el fons gris */
.app .panel{background:transparent;border:0;box-shadow:none;border-radius:0}
.content{max-width:1240px;gap:16px}
/* Capçalera de pàgina */
.head .big{font-weight:700;letter-spacing:-.045em}
#view[data-g] > .head{background:var(--gs);border:0;box-shadow:none;border-radius:32px;padding:28px 30px}
#view[data-g] > .head::after{display:none}
#view[data-g] > .head .label{background:var(--tile);border:0;box-shadow:none;color:var(--gc)}
#view[data-g] .intro{border-left:0;padding-left:0}
.tbanner{border-radius:28px;box-shadow:none;border-left:0;padding:18px 22px}
.head .hlogo{box-shadow:none;border:0;border-radius:20px}
.grpbar{background:var(--tile);border:0;border-radius:999px;padding:10px 18px}
/* Targetes */
.sheet,.list,.reportview,.rcard,.gcard,.rtab,.pimg,.pdoc,.aipick,.stat,.rsum-i,.list-body,.interview,.choice,.odsi{box-shadow:none}
.sheet{border:0;border-radius:var(--r-2xl);background:var(--tile)}
.list{background:var(--tile);border:0;border-radius:var(--r-2xl);padding:0 8px 8px}
#view[data-g] .list:not(.dafo .list){background:var(--gs)!important;border:0!important}
#view[data-g="prof"] .list:not(.dafo .list){background:var(--tile)!important}
#view[data-g="prof"] .list-body{background:var(--soft)}
.list-head{padding:16px 18px 12px;font-size:15.5px}
.list-body{border:0;border-radius:var(--r-xl)}
.stat{background:var(--tile)!important;border:0;border-radius:24px}
.stat:hover,.rsum-i:hover,.gcard:hover,.rtab:hover,.pdoc:hover,.pimg:hover{transform:none}
.stat > .muted.small:first-child{text-transform:none;letter-spacing:0;font-size:13.5px}
.rsum-i{border:0;border-radius:24px}
.rsum-i.edit b{color:var(--st-edit-f)}.rsum-i.warn{background:var(--ws-warn-s)}.rsum-i.warn b{color:var(--st-mil-f)}
.bar span,.gbar span{background:var(--pri)}
.bar,.gbar{background:var(--track)}
.interview{border:0;border-radius:var(--r-xl)}
.locked-box{border:2px dashed var(--dash);border-radius:var(--r-2xl);background:transparent}
.notice{border-radius:var(--r-xl);box-shadow:none}
.sendbar{border-radius:var(--r-xl);box-shadow:none}
details.ex{border-radius:var(--r-xl)}
/* Sense rètols en majúscules a la pantalla */
.ghead,.rotag,.rnav-g > span,.rblk,.subh,.tagauto,.crown,.sosttag,.app table.fin thead th,.app table.fin tr.sec td{text-transform:none;letter-spacing:0}
.app table.fin thead th{font-size:12.5px}
.subh,.rblk,.rnav-g > span{font-size:13px}
/* Botons: píndoles; el principal en indi */
.btn{border-radius:999px;background:var(--pri);border-color:var(--pri);color:var(--pri-fg);box-shadow:none;font-weight:600}
.btn:hover{background:var(--pri-h);border-color:var(--pri-h);box-shadow:none;transform:none}
.btn.ghost{background:var(--tile);color:var(--ink);border-color:var(--line-2);box-shadow:none}
.btn.ghost:hover{background:var(--soft);border-color:var(--dash);box-shadow:none}
.btn.small{border-radius:999px}
.sendbar.ws-edit .btn{background:var(--pri);border-color:var(--pri)}
.rb,.lvl,.upl{border-radius:999px}
.seg,.rfilters{border-radius:999px}.seg button:first-child{border-radius:999px 0 0 999px}.seg button:last-child{border-radius:0 999px 999px 0}.rfilters button{border-radius:999px}
/* Xips d'estat */
.pill,.wsbadge,.rfill,.gchip{border-radius:999px;box-shadow:none;font-weight:600}
.pill.ws-correcte,.wsbadge.correcte{background:var(--st-ok-b);color:var(--st-ok-f)}
.pill.ws-sent,.wsbadge.sent{background:var(--st-sent-b);color:var(--st-sent-f)}
.pill.ws-edit,.wsbadge.edit{background:var(--st-edit-b);color:var(--st-edit-f)}
.pill.ws-millorar,.wsbadge.millorar{background:var(--st-mil-b);color:var(--st-mil-f)}
.pill.grey,.pill.ws-none,.wsbadge.none{background:var(--st-none-b);color:var(--st-none-f)}
.nav .bullet.ws-edit{background:var(--ws-edit)!important}.nav .bullet.ws-millorar{background:var(--ws-warn)!important}.nav .bullet.ws-sent{background:var(--ws-sent)!important}.nav .bullet.ws-correcte{background:var(--ws-ok)!important}
.sendbar.ws-edit{background:var(--st-edit-b);border-color:#F2D58A;color:var(--st-edit-f)}
.sendbar.ws-millorar{background:var(--st-mil-b);border-color:#F5B9B2;color:var(--fb-f)}
.wsbadge.rvb.millorar{color:var(--st-mil-f)}
/* Camps */
input[type=text],input[type=number],input[type=url],input[type=email],input[type=date],select.field-sel,textarea,.field input,.pfield textarea,.pfield input[type=text]{border-radius:14px;box-shadow:none}
input:focus,textarea:focus,select:focus{border-color:var(--pri)!important;box-shadow:0 0 0 3px color-mix(in srgb,var(--pri) 18%,transparent)!important}
table.fin{box-shadow:none}

/* ---------- Inici de l'equip: blocs ---------- */
.ihero{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px}
.iname{grid-row:span 2;position:relative;background:var(--hero);color:var(--hero-fg);border-radius:32px;padding:34px 36px;display:flex;flex-direction:column;justify-content:space-between;gap:32px;min-height:340px;min-width:0}
.iname .k{margin:0;color:var(--hero-mu);font-size:15px;padding-right:90px}
.iname h1{margin:8px 0 0;font:700 clamp(48px,7vw,104px)/.92 var(--font);letter-spacing:-.045em;overflow-wrap:anywhere;text-wrap:balance}
.iname .d{margin:14px 0 0;font-size:21px;color:#E3E6F2;overflow-wrap:anywhere}
.iname .nlogo{position:absolute;top:26px;right:26px;width:72px;height:72px;border-radius:20px;background:#fff;padding:6px;display:grid;place-items:center}
.iname .nlogo img{width:100%;height:100%;object-fit:contain}
.iname .nlogo b{width:100%;height:100%;border-radius:14px;display:grid;place-items:center;background:var(--tb1);color:#fff;font-size:28px}
.ichips{display:flex;flex-wrap:wrap;gap:8px}
.ichips span{background:rgba(255,255,255,.12);padding:7px 14px;border-radius:999px;font-size:14.5px;font-weight:550}
.iprog{background:var(--tile);border-radius:32px;padding:26px 28px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.iring{position:relative;flex:none;width:128px;height:128px;border-radius:50%;background:conic-gradient(var(--pri) 0 var(--p),var(--track) 0);display:grid;place-items:center}
.iring::before{content:"";position:absolute;inset:14px;border-radius:50%;background:var(--tile)}
.iring b{position:relative;font-size:30px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.inx{flex:1 1 200px;display:grid;gap:6px;justify-items:start;min-width:0}
.inx small{color:var(--muted);font-size:14px}
.inx strong{font-size:22px;line-height:1.15;font-weight:650;letter-spacing:-.015em}
.inx .btn{margin-top:8px}
.istats{background:var(--tile);border-radius:32px;padding:22px 28px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.istats div{display:grid;gap:2px}
.istats b{font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.istats small{font-size:13.5px;color:var(--muted)}
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.bento .s5{grid-column:span 5}.bento .s7{grid-column:span 7}
.bl{border-radius:28px;padding:22px;background:var(--gs);display:flex;flex-direction:column;gap:10px;min-width:0}
.bh{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:2px}
.bh h2{margin:0;font:650 21px/1.15 var(--font);letter-spacing:-.02em}
.bcnt{background:var(--gc);color:var(--bg);font-weight:650;font-size:13.5px;padding:4px 11px;border-radius:999px;white-space:nowrap}
.bit{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:4px 12px;background:var(--bit);border:0;border-radius:16px;padding:11px 14px;width:100%;font:inherit;color:inherit;text-align:left;cursor:pointer;transition:background var(--t-fast)}
.bit:hover{background:var(--tile)}
.bit .n{font-weight:560;font-size:16px;min-width:0}
.bit .n em{display:block;font-style:normal;font-size:12.5px;color:var(--muted)}
.bst{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:12.5px;padding:4px 10px;border-radius:999px;white-space:nowrap;background:var(--st-none-b);color:var(--st-none-f)}
.bst::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.bst.correcte{background:var(--st-ok-b);color:var(--st-ok-f)}.bst.sent{background:var(--st-sent-b);color:var(--st-sent-f)}
.bst.edit,.bst.rev{background:var(--st-edit-b);color:var(--st-edit-f)}.bst.millorar,.bst.mil{background:var(--st-mil-b);color:var(--st-mil-f)}
.bfb{grid-column:1/-1;margin:2px 0 0;padding:10px 12px;border-radius:12px;background:var(--fb-b);color:var(--fb-f);font-size:14.5px;overflow-wrap:anywhere}
.bl.cl{background:transparent;border:2px dashed var(--dash);align-self:start}
.bl.cl .bit{background:color-mix(in srgb,var(--tile) 55%,transparent);color:var(--muted)}
.blk{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.blk svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
/* ---------- Seguiment del professorat ---------- */
.shead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px}
.sttl{background:var(--hero);color:var(--hero-fg);border-radius:32px;padding:30px 34px;display:flex;flex-direction:column;justify-content:space-between;gap:26px;min-height:200px;min-width:0}
.sttl p{margin:0;color:var(--hero-mu);font-size:15px}
.sttl h1{margin:0;font:700 clamp(44px,5.4vw,68px)/.95 var(--font);letter-spacing:-.04em}
.snums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.snums div{background:var(--tile);border-radius:28px;padding:20px 22px;display:flex;flex-direction:column;justify-content:space-between;gap:12px;min-width:0}
.snums b{font-weight:700;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.snums small{font-size:14px;color:var(--muted)}
.snums .hot{background:var(--hot)}.snums .hot b{color:#0F1222}.snums .hot small{color:var(--hot-f)}
.slist{display:grid;gap:12px}
.stm{display:grid;grid-template-columns:minmax(170px,1fr) minmax(220px,1.7fr) 86px minmax(150px,.9fr) minmax(160px,1fr);gap:10px 24px;align-items:center;background:var(--tile);border:0;border-radius:28px;padding:18px 26px;width:100%;font:inherit;color:inherit;text-align:left;cursor:pointer;transition:box-shadow var(--t-fast)}
.stm:hover{box-shadow:var(--sh-float)}
.stm .spc{white-space:nowrap}.srow{position:relative}.sedit{position:absolute;top:10px;right:14px;z-index:2;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:4px 12px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}.sedit:hover{box-shadow:var(--sh-float)}
.sedpanel{background:var(--soft);border-radius:22px;margin:8px 0 0;padding:18px;display:grid;gap:12px}.sedpanel .pfield{margin:0}
.btn.danger{color:#b3261e;border-color:#e6b4b0}
@media (max-width:620px){.srow .stm{padding-top:54px}}
.swho{display:flex;align-items:center;gap:14px;min-width:0}
.swho > div{min-width:0}
.ssq{flex:none;width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-weight:700;font-size:16px;color:#0F1222;overflow:hidden}
.ssq img{width:100%;height:100%;object-fit:contain;background:#fff;padding:4px}
.swho b{display:block;font-size:20px;font-weight:650;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere}
.swho small{color:var(--muted);font-size:14px}
.swho .smem{display:grid;gap:1px;margin-top:5px;font-size:13px;line-height:1.35;overflow-wrap:anywhere}
@media (min-width:981px){.stm{grid-template-columns:minmax(230px,1.35fr) minmax(170px,1.4fr) 86px minmax(150px,.9fr) minmax(160px,1fr)}}
.sseg{display:flex;gap:5px}
.sseg i{display:block;flex:1;height:16px;border-radius:8px;background:linear-gradient(90deg,var(--gc) var(--p),var(--track) var(--p))}
.sseg i.x{background:none;border:2px dashed var(--dash)}
.spc{font-size:30px;font-weight:700;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.stg{display:flex;flex-wrap:wrap;gap:6px}
.snx{font-weight:560;font-size:15.5px;display:grid;gap:2px;min-width:0}
.snx small{color:var(--muted);font-weight:450;font-size:13px}
/* ---------- Els meus grups ---------- */
.hhero{background:var(--hero);color:var(--hero-fg);border:0;border-radius:32px;padding:30px 34px}
.hhero h2{font-size:clamp(30px,4vw,44px);font-weight:700;letter-spacing:-.04em}
.hhero p{color:var(--hero-mu)}
.hhero .hill{--gc:#8F86FF;--gl:#FFD23F}
.hstats{gap:16px}
.hstats .stat{background:var(--tile)!important;border:0;border-radius:28px;padding:20px 22px}
.hstats .stat .v{font-size:40px;font-weight:700;letter-spacing:-.04em}
.hquick{gap:12px}
.hq{border:0;border-radius:24px;background:var(--tile);padding:16px 18px}
.hq:hover{box-shadow:var(--sh-float);border:0}
.hq .hqi{border-radius:14px}
.hqpick{border:0;border-radius:24px;background:var(--tile)}
.hqp{border-radius:999px;border-color:var(--line)}
.hsec{font-size:21px;font-weight:650;letter-spacing:-.02em;margin:14px 0 -4px}
.glist{gap:16px}
.gcard{border:0;border-radius:28px;background:var(--tile);padding:22px 24px}
.gcard:hover{box-shadow:var(--sh-float);border:0}
.gcard b{font-size:20px;letter-spacing:-.02em}
.gbar{height:10px}
.hsteps .n{background:var(--gs);color:var(--gc)}
.hsteps li.ok .n{background:var(--ws-ok)}
@media (max-width:980px){
  .shead{grid-template-columns:minmax(0,1fr)}
  .stm{grid-template-columns:minmax(0,1fr) auto}
  .stm > .sseg,.stm > .stg,.stm > .snx{grid-column:1/-1}
  .stm > .spc{grid-row:1;grid-column:2}
}
@media (max-width:820px){
  .ihero{grid-template-columns:minmax(0,1fr)}
  .iname{grid-row:auto;min-height:250px;padding:26px 24px}
  .iname h1{font-size:clamp(40px,13vw,64px)}
  .istats,.snums{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bento .s5,.bento .s7{grid-column:1/-1}
}
@media (max-width:620px){
  #view[data-g] > .head{padding:22px 20px;border-radius:26px}
  .grpbar{border-radius:20px}
  .iname{padding:24px 20px;border-radius:28px}.iname .k{padding-right:64px}.iname .nlogo{width:54px;height:54px;top:20px;right:20px;border-radius:16px}
  .iname .d{font-size:18px}
  .iprog,.istats{border-radius:28px;padding:20px}
  .iprog{gap:18px}.inx{flex-basis:130px}
  .iring{width:104px;height:104px}.iring::before{inset:12px}.iring b{font-size:25px}
  .bl{padding:16px;border-radius:24px}
  .stm{padding:16px 18px;border-radius:24px}
  .sttl{padding:24px 22px;min-height:150px;border-radius:28px}
  .snums{gap:12px}.snums div{border-radius:24px;padding:16px 18px}
  .hhero{padding:22px 20px;border-radius:28px}
}
/* Tema fosc dels blocs (:root.dark mana sobre html.dark) */
:root.dark{--page:#0B0C10;--tile:#16171D;--hero:#22243A;--hero-mu:#A9AFC6;--track:#2A2C36;--dash:#3A3D4A;--bit:rgba(255,255,255,.06);
  --pri:#F7A21B;--pri-h:#FFB43D;--pri-fg:#1B1303;--side-sel:#f4f4f5;--bg:#16171D;
  --st-ok-b:rgba(74,222,128,.14);--st-ok-f:#4ade80;--st-sent-b:rgba(96,165,250,.15);--st-sent-f:#93c5fd;--st-edit-b:rgba(251,191,36,.14);--st-edit-f:#fbbf24;
  --st-mil-b:rgba(248,113,113,.15);--st-mil-f:#fca5a5;--st-none-b:#27272a;--st-none-f:#a1a1aa;--fb-b:rgba(248,113,113,.12);--fb-f:#fecaca;--hot:#E8BC1E;--hot-f:#2a2100;
  --ws-edit:#fbbf24;--ws-edit-s:rgba(251,191,36,.11);--ws-warn:#f87171;--ws-warn-s:rgba(248,113,113,.12)}
html.dark .iname .d{color:#D6DAEA}
:root.dark .btn:not(.ghost),:root.dark .sendbar.ws-edit .btn{background:var(--pri);border-color:var(--pri);color:var(--pri-fg);box-shadow:none}
:root.dark .btn:not(.ghost):hover{background:var(--pri-h);border-color:var(--pri-h);box-shadow:none}
:root.dark #view[data-g] > .head{background:var(--gs)}
:root.dark .app .panel{border:0;box-shadow:none}
:root.dark .sendbar.ws-edit{border-color:rgba(251,191,36,.3);color:#fde68a}
:root.dark .sendbar.ws-millorar{border-color:rgba(248,113,113,.3);color:#fecaca}
:root.dark .wsbadge.millorar,:root.dark .pill.ws-millorar,:root.dark .wsbadge.rvb.millorar,:root.dark .rsum-i.warn b{color:var(--st-mil-f)}

/* ================= TEMA FOSC =================
   S'activa amb la classe html.dark (interruptor d'Aparença: automàtic, clar o fosc). Els PDF es generen sempre en clar (.pdfbox). */
  html.dark{
    color-scheme:dark;
    --side:#09090b; --side-2:#1c1c20; --side-3:#27272a; --side-fg:#f4f4f5; --side-muted:#8b8b94;
    --side-hover:rgba(255,255,255,.05); --side-ring:rgba(255,255,255,.05); --side-border:#3f3f46; --side-sel:#1c1c20;
    --bg:#18181b; --canvas:#111113; --soft:#202024; --ink:#f4f4f5; --ink-2:#d4d4d8; --muted:#a1a1aa;
    --line:rgba(63,63,70,.7); --line-2:#3f3f46;
    --accent:#fbab24; --accent-ink:#fcc14d; --accent-soft:rgba(251,171,36,.13);
    --blue:#60a5fa; --blue-soft:rgba(59,130,246,.14);
    --warn:#fbbf24; --warn-soft:rgba(245,158,11,.12); --bad:#f87171; --bad-soft:rgba(239,68,68,.12);
    --sh-xs:0 1px 2px rgba(0,0,0,.35);
    --sh-sm:0 1px 2px rgba(0,0,0,.35),0 2px 6px rgba(0,0,0,.2);
    --sh-md:0 2px 4px rgba(0,0,0,.3),0 10px 24px -4px rgba(0,0,0,.5);
    --sh-lg:0 4px 8px rgba(0,0,0,.3),0 20px 40px -8px rgba(0,0,0,.6);
    --ring:0 0 0 3px rgba(96,165,250,.28);
    --tn-a:#7aa2e3; --tn-pn:#5fbf8a; --tn-pas:#d6a05a; --tn-in:#5fbf8a; --tn-out:#e07a6e; --tn-res:#9d93e0; --tn-ra4:#6b9bff; --tn-ra5:#b48ae8;
    --tn-a-s:color-mix(in srgb,var(--tn-a) 8%,#18181b); --tn-a-m:color-mix(in srgb,var(--tn-a) 16%,#18181b);
    --tn-pn-s:color-mix(in srgb,var(--tn-pn) 8%,#18181b); --tn-pn-m:color-mix(in srgb,var(--tn-pn) 16%,#18181b);
    --tn-pas-s:color-mix(in srgb,var(--tn-pas) 8%,#18181b); --tn-pas-m:color-mix(in srgb,var(--tn-pas) 16%,#18181b);
    --tn-in-s:color-mix(in srgb,var(--tn-in) 8%,#18181b); --tn-in-m:color-mix(in srgb,var(--tn-in) 16%,#18181b);
    --tn-out-s:color-mix(in srgb,var(--tn-out) 8%,#18181b); --tn-out-m:color-mix(in srgb,var(--tn-out) 16%,#18181b);
    --tn-res-s:color-mix(in srgb,var(--tn-res) 8%,#18181b); --tn-res-m:color-mix(in srgb,var(--tn-res) 16%,#18181b);
    --ws-edit:#f87171; --ws-edit-s:rgba(248,113,113,.12); --ws-sent:#60a5fa; --ws-sent-s:rgba(96,165,250,.12);
    --ws-ok:#4ade80; --ws-ok-s:rgba(74,222,128,.11); --ws-warn:#fbbf24; --ws-warn-s:rgba(251,191,36,.11); --ws-none:#52525b;
  }
  /* Colors de bloc: el to clar fa de color principal i el fons és una tinta fosca */
  html.dark [data-g]{--gc:var(--gl);--gs:color-mix(in srgb,var(--gl) 11%,#18181b)}
  html.dark *{scrollbar-color:#3f3f46 transparent}
  html.dark .t-ra4{--tone-s:color-mix(in srgb,var(--tn-ra4) 8%,#18181b);--tone-m:color-mix(in srgb,var(--tn-ra4) 16%,#18181b)}
  html.dark .t-ra5{--tone-s:color-mix(in srgb,var(--tn-ra5) 8%,#18181b);--tone-m:color-mix(in srgb,var(--tn-ra5) 16%,#18181b)}

  html.dark .panel{border-color:rgba(255,255,255,.06);box-shadow:0 0 0 1px rgba(0,0,0,.6),0 24px 48px -12px rgba(0,0,0,.7)}

  html.dark .app .g-hi{background:rgba(74,222,128,.14);color:#4ade80}html.dark .app .g-ok{background:rgba(45,212,191,.14);color:#2dd4bf}html.dark .app .g-mid{background:rgba(251,191,36,.14);color:#fbbf24}html.dark .app .g-low{background:rgba(248,113,113,.14);color:#f87171}html.dark .app .g-none{background:#27272a;color:#a1a1aa}

    ${docs.length ? `<div class="pdocs">${docs.map(([f, i]) => `<div class="pdoc"><span class="pext">${esc((f.name.split('.').pop() || '').toUpperCase())}</span><div style="min-width:0"><b>${esc(f.name)}</b><div class="small muted">${fmtSize(f.size || 0)}</div></div>${edit ? `<button type="button" class="btn ghost small keep" data-pget="${i}">Descarregar</button><button type="button" class="btn ghost small" data-pdel="${i}">Treure</button>` : ''}</div>`).join('')}</div>` : ''}`;

function dataUrlBlob(u) { const [h, b] = u.split(','); const bin = atob(b); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: (h.match(/data:([^;]+)/) || [])[1] || 'application/octet-stream' }); }
function bindProtoFiles() {
  const inp = $('#protoIn'); if (!inp) return;
  const d = T().data.prototip; if (!Array.isArray(d.fitxers)) d.fitxers = [];
  const msg = m => { const el = $('#protoMsg'); if (el) el.textContent = m; };
  const rer = () => { const y = window.scrollY; render(); window.scrollTo(0, y); };
  const readImg = f => readImgFile(f, 1200);
  const readDoc = f => new Promise((ok, ko) => { const r = new FileReader(); r.onerror = ko; r.onload = () => ok({ kind: 'doc', name: f.name, size: f.size, data: r.result }); r.readAsDataURL(f); });
  inp.onchange = async e => {
    if (access('prototip') !== 'open') return;
    const files = [...e.target.files]; let skipped = [];
    for (const f of files) {
      if (d.fitxers.length >= PROTO_MAX) { skipped.push(`${f.name} (ja n'hi ha ${PROTO_MAX})`); continue; }
      const ext = (f.name.split('.').pop() || '').toLowerCase(), isImg = /^image\//.test(f.type);
      if (!isImg && !['pdf', 'docx', 'pptx'].includes(ext)) { skipped.push(`${f.name} (format no admès)`); continue; }
      if (!isImg && f.size > PROTO_DOC_MAX) { skipped.push(`${f.name} (fa ${fmtSize(f.size)} i el màxim és 700 kB: deseu-lo com a PDF més lleuger o pugeu-ne captures)`); continue; }
      try { const item = await (isImg ? readImg(f) : readDoc(f)); d.fitxers.push(item); T().updated = Date.now();
        if (!save()) { d.fitxers.pop(); save(); skipped.push(`${f.name} (no hi ha prou espai al navegador)`); } }
      catch (err) { skipped.push(`${f.name} (${err && err.message === 'big' ? 'la imatge és massa pesada' : 'no s\'ha pogut llegir'})`); }
    }
    rer(); if (skipped.length) msg('No s\'ha afegit: ' + skipped.join('; ') + '.');
  };
  $('#protoFiles').addEventListener('click', async e => {
    const del = e.target.closest('[data-pdel]'), get = e.target.closest('[data-pget]');
    if (del && access('prototip') === 'open') { d.fitxers.splice(Number(del.dataset.pdel), 1); T().updated = Date.now(); save(); rer(); }
    if (get) { const f = d.fitxers[Number(get.dataset.pget)]; const dl = await getDownloads(); if (!dl) { get.textContent = 'No disponible aquí'; return; }
      try { await dl.save({ filename: f.name, data: dataUrlBlob(f.data) }); } catch (err) { get.textContent = err && err.code === 'declined' ? 'Cancel·lat' : 'No s\'ha pogut'; } }
  });
}
// Llegeix una imatge, la redueix i la desa en JPG perquè càpiga en una fitxa de Firebase
function readImgFile(f, maxSide) {
  return new Promise((ok, ko) => { const r = new FileReader(); r.onerror = ko; r.onload = () => { const img = new Image(); img.onerror = ko; img.onload = () => { const s = Math.min(1, maxSide / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); const x = c.getContext('2d'); x.fillStyle = '#ffffff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height); let data = c.toDataURL('image/jpeg', 0.82); for (let q = 0.7; data.length > FILE_DATA_MAX && q > 0.3; q -= 0.15) data = c.toDataURL('image/jpeg', q); if (data.length > FILE_DATA_MAX) return ko(new Error('big')); ok({ kind: 'img', name: f.name.replace(/\.[^.]+$/, '') + '.jpg', size: Math.round(data.length * 0.75), data }); }; img.src = r.result; }; r.readAsDataURL(f); });
}

function invAside(t) {
  const I = PE.investTotals(t.data), el = $('#pageAside'); if (!el) return;
  el.innerHTML = `<h2>Resum</h2>${kv('Inversions inicials', N(I.inv) + ' €')}${kv('Fons de maniobra', N(num(t.data.inversio.fons)) + ' €')}${kv('Necessitat total', '<b>' + N(I.need) + ' €</b>')}${kv('Finançament aconseguit', '<b>' + N(I.fin) + ' €</b>')}${kv('Diferència', E(I.gap))}${kv('Finançament socialment responsable', I.fin ? Math.round(I.resp / I.fin * 100) + ' %' : '—')}${kv('Amortització anual', N(I.amort) + ' €')}
    ${I.need === 0 ? '<div class="notice info">Afegiu les inversions i el finançament.</div>' : I.gap < 0 ? `<div class="notice">Us falten ${N(-I.gap)} € per cobrir les necessitats.</div>` : '<div class="notice info">El pla d\'inversió i finançament és equilibrat.</div>'}`;
}
function balanceHtml(d) {
  const B = PE.openingBalance(d);
  const ln = (l, x, tone, cls = '') => `<tr class="t-${tone} ${cls}"><td>${l}</td><td class="n">${E(x)}</td></tr>`;
  const ok = Math.abs(B.assets - B.total) < 1;
  return pad(`${legend([['a', 'Actiu'], ['pn', 'Patrimoni net'], ['pas', 'Passiu']])}
    <div class="tacc"><div class="tablebox"><table class="fin"><thead><tr><th class="h-a" colspan="2">Actiu · el que té l'empresa</th></tr></thead><tbody>
      <tr class="t-a sec"><td colspan="2">Actiu no corrent</td></tr>${B.nc.length ? B.nc.map(([l, x]) => ln(esc(l), x, 'a')).join('') : '<tr class="t-a"><td colspan="2" class="muted small">Sense inversions amb vida útil</td></tr>'}${ln('Total actiu no corrent', B.ncT, 'a', 'sub')}
      <tr class="t-a sec"><td colspan="2">Actiu corrent</td></tr>${ln('Tresoreria (bancs i caixa)', B.cash, 'a')}
      ${ln('TOTAL ACTIU', B.assets, 'a', 'tot')}</tbody></table></div>
    <div class="tablebox"><table class="fin"><thead><tr><th class="h-p" colspan="2">Patrimoni net i passiu · d'on surten els diners</th></tr></thead><tbody>
      <tr class="t-pn sec"><td colspan="2">Patrimoni net</td></tr>${ln('Capital (aportacions dels socis)', B.capital, 'pn')}${B.subv ? ln('Subvencions, donacions i micromecenatge', B.subv, 'pn') : ''}${B.result ? ln('Resultat (despeses inicials)', B.result, 'pn') : ''}${ln('Total patrimoni net', B.pn, 'pn', 'sub')}
      <tr class="t-pas sec"><td colspan="2">Passiu</td></tr>${ln('Deutes a llarg termini (préstecs)', B.lt, 'pas')}${B.other ? ln('Altres deutes', B.other, 'pas') : ''}${ln('Total passiu', B.pas, 'pas', 'sub')}
      ${ln('TOTAL PATRIMONI NET I PASSIU', B.total, 'pas', 'tot')}</tbody></table></div></div>
    <p class="small ${ok ? 'muted' : 'neg'}">${ok ? 'El balanç quadra: actiu = patrimoni net + passiu.' : 'El balanç no quadra.'} ${B.cash < 0 ? '<b class="neg">La tresoreria inicial és negativa: falta finançament.</b>' : ''} Les despeses que no tenen vida útil (com les de constitució) no són actiu: redueixen el patrimoni net.</p>`);
}

function secPistesCard(kind) {

  const llista = kind === 'micro' ? PISTES_MICRO.map(([c, l]) => [l, P.micro[c]]) : PE.PESTEL.map(([c, l]) => [l, P.pestel[c]]);
  return card(tit + ' · ' + esc(S.short), pad(`<p class="small muted">Preguntes per començar a buscar informació del vostre sector. No hi ha respostes: les heu de trobar vosaltres i escriure-les amb les vostres paraules.</p>${llista.map(([l, q]) => `<p class="small" style="margin:8px 0"><b>${esc(l)}:</b> ${esc(q)}</p>`).join('')}`));
}

// Cost d'una oferta per a un import: quota, cost total (interessos + comissió) i TAE aproximada
function costOferta(o, P) {
  const L = PE.loan({ import: P, tin: o.tin, anys: o.anys }), fee = P * o.com / 100, net = P - fee;
  let tae = 0;
  if (L.quota && L.n) { let lo = 0, hi = 0.05; for (let i = 0; i < 60; i++) { const r = (lo + hi) / 2, pv = r ? L.quota * (1 - Math.pow(1 + r, -L.n)) / r : L.quota * L.n; if (pv > net) lo = r; else hi = r; } tae = (Math.pow(1 + (lo + hi) / 2, 12) - 1) * 100; }
  return { quota: L.quota, cost: L.interest + fee, tae };
}

  const ofs = Object.keys(BANCS).map(b => {

    return `<div style="border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px;${triada ? 'border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)' : ''}">

      <div class="small">${kv('Interès (TIN)', f1(o.tin) + ' %')}${kv('Comissió d\'obertura', f1(o.com) + ' %')}${kv('Termini', o.anys + (o.anys === 1 ? ' any' : ' anys'))}${kv('Import màxim', N(o.max) + ' €')}</div>

// Dades del tauler: grups del professor i si pot crear-ne. Les dues consultes es fan alhora
async function homeFetch() {
  let gs = [], listErr = '', ok = isAdmin(), req = null, nReq = 0;
  const pG = FB.list('groups', ['profs', 'array-contains', USER.email]).then(l => { gs = l; }).catch(e => { listErr = (e && (e.code || e.message)) || 'error'; console.warn(e); });
  const pP = ok ? FB.list('profreq', ['status', '==', 'pending']).then(l => { nReq = l.length; }).catch(() => {})
    : FB.get('profs/' + USER.email).then(x => { ok = !!x; }).catch(() => {}).then(() => ok ? null : FB.get('profreq/' + USER.email).then(x => { req = x; }).catch(() => {}));
  await Promise.all([pG, pP]);
  const now = Date.now(), dead = gs.filter(g => g.expiresAt && g.expiresAt < now);
  if (dead.length) { await Promise.all(dead.map(g => deleteGroupDeep(g.id).catch(() => {}))); gs = gs.filter(g => !dead.includes(g)); }
  return { email: USER.email, gs, listErr, ok, req, nReq };
}

async function createGroupDoc() {

const courseLabel = exp => { const y = new Date(exp).getFullYear(); return (y - 1) + '-' + String(y).slice(2); };
async function deleteGroupDeep(gid) {
  const base = 'groups/' + gid, ops = [];
  const teams = await FB.list(base + '/teams').catch(() => []);
  for (const t of teams) {
    const files = await FB.list(base + '/teams/' + t.id + '/files').catch(() => []);
    files.forEach(f => ops.push({ op: 'del', path: base + '/teams/' + t.id + '/files/' + f.id }));
    ['review', 'grades', 'ai'].forEach(p => ops.push({ op: 'del', path: base + '/teams/' + t.id + '/prof/' + p }));
    ops.push({ op: 'del', path: base + '/teams/' + t.id });
  }
  const mem = await FB.list(base + '/members').catch(() => []);
  mem.forEach(m => ops.push({ op: 'del', path: base + '/members/' + m.id }));
  const inv = await FB.list(base + '/invites').catch(() => []);

function revLog(t, k) {
  const r = t.review[k]; if (!r) return;
  const l = Array.isArray(r.log) ? r.log : (r.log = []), now = Date.now(), last = l[l.length - 1], e = { at: now, s: r.status || '', c: (r.comment || '').trim() };
  const recent = last && now - last.at < 5 * 6e4; // canvis seguits del mateix moment: una sola notificació
  if (!e.s && !e.c) { if (recent) l.pop(); return; }
  if (recent) l[l.length - 1] = e; else if (!last || last.s !== e.s || last.c !== e.c) l.push(e);
  if (l.length > 20) l.splice(0, l.length - 20);
}

    ${card('Aparença', pad(`<p class="muted small">Tria com vols veure la web. «Automàtic» segueix el mode clar o fosc de l'ordinador o el mòbil. Es desa en aquest navegador: cada persona pot triar el seu.</p>${themeSw()}`))}
    ${card('Grup classe', pad(`<div class="pfield"><label for="gName">Nom del grup</label><input type="text" id="gName" value="${esc(G.name)}"></div>
      <div class="pfield"><label for="gFem">Com us anomena l'eina davant l'alumnat</label><div class="help">Als missatges per a l'alumnat («Enviar al professor», «La professora us demana millores»...).${G.profName ? ` Amb «Automàtic» es tria segons el nom de qui ha creat el grup (${esc(G.profName)}): ara diu «${PR('n')}».` : ''}</div><select class="field-sel" id="gFem"><option value="">Automàtic</option><option value="m" ${G.profFem === 'm' ? 'selected' : ''}>Professor</option><option value="f" ${G.profFem === 'f' ? 'selected' : ''}>Professora</option></select></div>
      <div class="pfield"><label for="gSector">Tipus d'empresa (sector) del grup</label><div class="help">Si el canvies, també canvia als equips que tenien el sector anterior. Els equips que n'han triat un altre el conserven. Sota pots canviar el de cada equip.</div><select class="field-sel" id="gSector">${secOptsAll(G.sector)}</select></div>
      <div class="pfield"><label>Equips i tipus d'empresa de cadascun</label>${G.teams.map((t, i) => `<div class="member tsrow"><input type="text" data-tn="${i}" value="${esc(t.name)}" aria-label="Nom de l'equip ${i + 1}"><select class="field-sel" data-tsec="${i}" aria-label="Sector de ${esc(t.name)}">${secOptsAll(t.data.idea.sector, true)}</select><button type="button" class="btn ghost small" data-tdel="${i}">Esborrar</button></div>`).join('')}<div id="delBox"></div><button type="button" class="btn ghost small" id="tAdd">+ Afegir un equip</button></div>
      ${(G.trash || []).length ? `<div class="pfield"><label>Paperera d'equips</label><div class="help">Els equips esborrats es guarden ${TRASH_DAYS} dies amb tot el seu projecte. Després s'eliminen del tot.</div>${G.trash.map((x, i) => `<div class="member trow"><span><b>${esc(x.name)}</b><span class="small muted"> · s'eliminarà el ${fmtDay(x.at + TRASH_DAYS * 864e5)}</span></span><button type="button" class="btn ghost small" data-trec="${i}">Recuperar</button><button type="button" class="btn ghost small" data-tkill="${i}">Eliminar del tot</button></div>`).join('')}<div id="killBox"></div></div>` : ''}`))}
    ${cloudConfigHtml()}
    ${actsConfigHtml()}
    ${CLOUD ? '' : card('Començar un grup nou', pad(`<p class="muted small">Esborra tots els projectes ${CLOUD ? 'del grup' : 'd\'aquest navegador'} i crea un grup buit. Si els vols conservar, fes primer una còpia de seguretat.</p>
      <div class="pfield"><label for="ngName">Nom del grup</label><input type="text" id="ngName" value="IPO II · 2n CFGM"></div>
      <div class="pfield"><label for="ngTeams">Equips (un per línia)</label><textarea id="ngTeams" rows="5">Equip 1\nEquip 2\nEquip 3\nEquip 4\nEquip 5</textarea></div>
      <div id="ngBox"></div><div class="row"><button class="btn" id="ngCreate">Crear el grup</button>${CLOUD ? '' : '<button class="btn ghost" id="ngExample">Tornar a les dades d\'exemple</button>'}</div>`))}
    ${CLOUD ? '' : `<div class="grid2">
      ${card('Còpia de seguretat', pad(`<p class="muted small">Copia aquest text i desa'l en un document. Serveix per recuperar les dades o per obrir-les en un altre ordinador.</p><textarea id="expTxt" readonly rows="5" aria-label="Text de la còpia de seguretat"></textarea><button class="btn ghost small" id="expCopy">Copiar el text</button>`))}
      ${card('Recuperar una còpia', pad(`<textarea id="impTxt" rows="5" aria-label="Text de la còpia per recuperar" placeholder="Enganxa aquí el text de la còpia"></textarea><input type="file" id="impFile" accept=".json,.txt"><div id="impMsg"></div><button class="btn small" id="impBtn">Recuperar</button>`))}
    </div>`}`;
  bindActsConfig(v); bindCloudConfig(v);
  $('#gName').oninput = e => { G.name = e.target.value; save(); renderSide(); };
  $('#gFem').onchange = e => { if (e.target.value) G.profFem = e.target.value; else delete G.profFem; save(); render(); };
  $('#gSector').onchange = e => { const old = G.sector, n = G.teams.filter(t => !t.data.idea.sector || t.data.idea.sector === old); G.sector = e.target.value; n.forEach(t => { t.data.idea.sector = G.sector; }); save(); const y = window.scrollY; render(); window.scrollTo(0, y); toast(n.length ? `Sector canviat al grup i a ${n.length === 1 ? '1 equip' : n.length + ' equips'}.` : 'Sector del grup canviat.'); };
  v.querySelectorAll('[data-tsec]').forEach(s => s.onchange = () => { const t = G.teams[+s.dataset.tsec]; t.data.idea.sector = s.value; t.updated = Date.now(); save(); toast(`Sector de ${t.name} canviat.`); });
  v.querySelectorAll('[data-tn]').forEach(i => i.oninput = () => { G.teams[+i.dataset.tn].name = i.value; save(); renderSide(); });
  v.querySelectorAll('[data-tdel]').forEach(b => b.onclick = () => { const i = +b.dataset.tdel; $('#delBox').innerHTML = `<div class="notice">Vols enviar «${esc(G.teams[i].name)}»${projName(G.teams[i]) !== G.teams[i].name ? ' (' + esc(projName(G.teams[i])) + ')' : ''} a la paperera? El podràs recuperar durant ${TRASH_DAYS} dies. ${CLOUD ? 'Mentrestant, els seus alumnes no hi podran entrar. ' : ''}<button class="btn small" id="delYes">Enviar a la paperera</button> <button class="btn ghost small" id="delNo">Cancel·lar</button></div>`; $('#delYes').onclick = () => { trashTeam(i); profTeam = 0; save(); render(); toast('Equip enviat a la paperera.'); }; $('#delNo').onclick = () => { $('#delBox').innerHTML = ''; }; });
  v.querySelectorAll('[data-trec]').forEach(b => b.onclick = async () => { const x = G.trash[+b.dataset.trec]; if (!x) return; b.disabled = true;
    if (CLOUD) { let ok = false; try { ok = await pullTeam(x.id); } catch (e) {} if (!ok) { b.disabled = false; toast('No s\'ha pogut recuperar. Torna-ho a provar.'); return; } } else if (x.t) G.teams.push(x.t);
    G.trash = G.trash.filter(y => y !== x); save(); render(); toast('Equip recuperat.'); });
  v.querySelectorAll('[data-tkill]').forEach(b => b.onclick = () => { const x = G.trash[+b.dataset.tkill]; if (!x) return;
    $('#killBox').innerHTML = `<div class="notice">Segur que vols eliminar «${esc(x.name)}» del tot? No es podrà desfer. <button class="btn small" id="killYes">Eliminar del tot</button> <button class="btn ghost small" id="killNo">Cancel·lar</button></div>`;
    $('#killYes').onclick = () => { G.trash = G.trash.filter(y => y !== x); save(); render(); toast('Equip eliminat.'); }; $('#killNo').onclick = () => { $('#killBox').innerHTML = ''; }; });
  $('#tAdd').onclick = () => { addTeam(); render(); };
  if (!CLOUD) $('#ngCreate').onclick = () => { const names = $('#ngTeams').value.split('\n').map(x => x.trim()).filter(Boolean); if (!names.length) { $('#ngBox').innerHTML = '<div class="notice">Escriu com a mínim un equip.</div>'; return; }
    $('#ngBox').innerHTML = `<div class="notice">Segur? S'esborraran tots els projectes actuals. <button class="btn small" id="ngYes">Sí, crear el grup</button> <button class="btn ghost small" id="ngNo">Cancel·lar</button></div>`;
    $('#ngYes').onclick = () => { const acts = G.acts, rubs = G.rubs, profs = G.profs; G = newGroup($('#ngName').value.trim() || 'IPO II', names, G.sector); G.acts = acts; G.rubs = rubs; if (profs) G.profs = profs; ensureEval(); role = 'prof'; tab = null; save(); render(); }; $('#ngNo').onclick = () => { $('#ngBox').innerHTML = ''; }; };
  if ($('#ngExample')) $('#ngExample').onclick = () => { G = exampleGroup(); ensureEval(); role = 'prof'; tab = null; save(); render(); };
  if (!CLOUD) $('#expTxt').value = JSON.stringify(G);
  if (!CLOUD) $('#expCopy').onclick = async () => { const x = $('#expTxt'); try { await navigator.clipboard.writeText(x.value); $('#expCopy').textContent = 'Copiat'; } catch (e) { x.select(); $('#expCopy').textContent = 'Text seleccionat: prem Ctrl+C'; } };
  if (!CLOUD) $('#impFile').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $('#impTxt').value = r.result; }; r.readAsText(f); };
  if (!CLOUD) $('#impBtn').onclick = () => { try { const g = JSON.parse($('#impTxt').value); if (g.v !== 1 || !g.teams) throw 0; if (CLOUD) g.teams.forEach(t => { t.id = newId(); }); G = g; ensureIds(); ensureEval(); role = 'prof'; tab = null; save(); render(); } catch (e) { $('#impMsg').innerHTML = '<div class="notice">Aquest text no és una còpia vàlida. Comprova que l\'has copiat sencer.</div>'; } };
}

/* ================= Dades d'exemple ================= */
/* ================= Arrencada ================= */
const VIEWS = { inici: vInici, equip: vEquip, idea: vIdea, empatia: vEmpatia, entrevistes: vEntrevistes, definir: vDefinir, prototip: vPrototip, micro: vMicro, pestel: vPestel, dafo: vDafo,
  lean: vLean, sost: vSost, ebc: vEbc, agents: vAgents, juridica: vJuridica, fiscal: vFiscal, inversio: vInversio, prestec: vPrestec, treso: vTreso, viab: vViab, marca: vMarca, p7: vP7, pitch: vPitch, dossier: vDossier,
  seguiment: vSeguiment, revisio: vRevisio, avaluacio: vAvaluacio, guia: vGuia, rubriques: vRubriques, config: vConfig, alumnes: vAlumnes, qualificacio: vQualificacio, obertura: vObertura, informe: vInforme, notes: vNotes, criteris: vCriteris, grups: () => { location.hash = ''; } };
$('#tabs').insertAdjacentHTML('beforebegin', '<button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false"></button>');
document.querySelector('.side-foot').insertAdjacentHTML('beforeend', '<div id="sideAction"></div>' + themeSw());
$('#menuToggle').onclick = () => setNav(!document.querySelector('.side').classList.contains('open'));
document.querySelector('.side').id = 'sideNav';
document.body.insertAdjacentHTML('beforeend', '<button type="button" class="navbtn" id="navBtn" aria-controls="sideNav" aria-expanded="false" aria-label="Obrir el menú" title="Menú"><i></i><i></i><i></i></button><div class="side-back" aria-hidden="true"></div>');
$('#navBtn').onclick = () => setNav(!document.querySelector('.side').classList.contains('open'));
document.querySelector('.side-back').onclick = () => setNav(false);
// En mòbil, el botó del menú s'amaga en baixar i torna en pujar
{ let ly = 0; window.addEventListener('scroll', () => { const y = window.scrollY, nb = $('#navBtn'); if (Math.abs(y - ly) < 6) return; nb.classList.toggle('away', y > ly && y > 90 && !document.querySelector('.side.open')); const bb = $('#bellBtn'), sb = $('#segBtn'); if (bb) bb.classList.toggle('away', nb.classList.contains('away') && !$('#bellPop')); if (sb) sb.classList.toggle('away', nb.classList.contains('away')); ly = y; }, { passive: true }); }
// El logo porta al tauler: «Els meus grups» (professorat) o l'inici de l'equip (alumnat)
const brand = document.querySelector('.brand'); brand.setAttribute('role', 'link'); brand.tabIndex = 0; brand.title = 'Anar al tauler';
const goHome = () => { setNav(false);
  if (CLOUD && !(ME && !ME.isProf && GID)) { if (location.hash && location.hash !== '#') location.hash = ''; else if (USER) route(); window.scrollTo(0, 0); return; }
  go(role === 'prof' ? 'seguiment' : 'inici'); };
brand.onclick = goHome; brand.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goHome(); } };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.querySelector('.side.open')) setNav(false); });
if (CLOUD) cloudBoot();
else {
  if (!load()) { G = exampleGroup(); ensureIds(); save(); }
  ensureEval();
  if (role !== 'prof' && !G.teams[role]) role = 'prof';
  render();
}
})();
</script>
