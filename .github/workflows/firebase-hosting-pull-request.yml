name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Revisió automàtica: obre totes les pàgines i, si troba cap error, atura la publicació
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Revisió automàtica de la web
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tests/smoke.cjs
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IPO_EMPREN }}
          projectId: ipo-empren
