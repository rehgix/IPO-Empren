# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Revisió automàtica: obre totes les pàgines i, si troba cap error, atura la publicació
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Revisió automàtica de la web
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-audit --no-fund playwright@1.63.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" node tests/smoke.cjs
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IPO_EMPREN }}
          channelId: live
          projectId: ipo-empren
      # Publica també les regles de seguretat de la base de dades (firestore.rules)
      - name: Publica les regles de Firestore
        env:
          SA_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IPO_EMPREN }}
        run: |
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa.json"
          GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx -y firebase-tools@13 deploy --only firestore:rules --project ipo-empren --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
