<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" width="1920" height="1080">
  <defs>
    <!-- Difuminat de les taques -->
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="120"/>
    </filter>
    <!-- Trama de punts molt suau -->
    <pattern id="punts" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#E8A33D" fill-opacity="0.16"/>
    </pattern>
    <!-- Esvaïment de la trama cap al centre -->
    <radialGradient id="mascaraGrad" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#000"/>
      <stop offset="100%" stop-color="#fff"/>
    </radialGradient>
    <mask id="mascara">
      <rect width="1920" height="1080" fill="url(#mascaraGrad)"/>
    </mask>
  </defs>

  <!-- Color base: blanc trencat càlid -->
  <rect width="1920" height="1080" fill="#FFFBF4"/>

  <!-- Taques de color difuminades -->
  <g filter="url(#blur)">
    <circle cx="180"  cy="120"  r="360" fill="#FFD27A" fill-opacity="0.45"/>
    <circle cx="1760" cy="220"  r="320" fill="#FFB45C" fill-opacity="0.30"/>
    <circle cx="1500" cy="980"  r="420" fill="#FFE2A8" fill-opacity="0.50"/>
    <circle cx="420"  cy="1000" r="300" fill="#FFC46B" fill-opacity="0.25"/>
    <circle cx="960"  cy="540"  r="260" fill="#FFF1D6" fill-opacity="0.60"/>
  </g>

  <!-- Trama de punts (més visible a les vores) -->
  <rect width="1920" height="1080" fill="url(#punts)" mask="url(#mascara)"/>
</svg>
